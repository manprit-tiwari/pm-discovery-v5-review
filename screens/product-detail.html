<!doctype html>
<!--
  DISCOVERY v6 SCREEN — Product detail. Finished Goods (no ?type=raw) render the v6 operational
  layout (Addendum 007, iteration 2): header with lifecycle status + Edit / More, tabs Overview ·
  Pricing · Units & Packaging · Inventory · Customers · Catalogues · Orders · Activity, and the
  list's own wizards (fg-workspace.js) for one-product changes. Raw Materials stay v5 below.
  v5 notes (Addendum 006: baseline sync to Development):
  Ports ProductDetailPage + useProductDetailController (+ ProductDrawer for Edit, shared from
  ../assets/ui/product-drawer.js). Mounted as the host mounts it
  (storefront-frontend pages/ProductManagementDetails.jsx): ?id=<productId>, ?type=raw for a
  Raw Material (catalogueType RAW-MATERIAL, listPath /raw-materials). onNotify → host toasts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Detail — Discovery v6</title>
<link rel="stylesheet" href="../assets/module.css?v=6.4">
<script src="../assets/pm-core.js?v=6.4"></script>
<script src="../assets/ui/icons.js?v=6.4"></script>
<script src="../assets/ui/kit.js?v=6.4"></script>
<script src="../assets/ui/unit-price.js?v=6.4"></script>
<script src="../assets/ui/product-drawer.js?v=6.4"></script>
<script src="../assets/ui/fg-workspace.js?v=6.4"></script>
<script src="../assets/ui/boot.js?v=6.4"></script>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const isRawRoute = params.get("type") === "raw";
const catalogueType = isRawRoute ? "RAW-MATERIAL" : "DEFAULT";
const listPath = isRawRoute ? "raw-materials-list.html" : "products-list.html";
const productId = params.get("id") || (isRawRoute ? "rm-1" : "sb-2");
const onNotify = (m, t) => Boot.onNotify(m, t);
let api, locationId;

// ---- useProductDetailController ------------------------------------------------------------
const D = { product: null, isLoading: true, error: null, categoryName: undefined, images: [], requiredStock: undefined, isEditOpen: false, selectedImage: 0 };
let seq = 0;
async function load() {
  const my = ++seq;
  D.isLoading = true;
  K.update();
  try {
    const [product, tree, demand, imgs] = await Promise.all([api.getProduct(productId), api.listCategories(locationId), api.getStockDemand(locationId), api.getProductImages(productId).catch(() => ({ images: [], clearedSlots: [] }))]);
    if (my !== seq) return;
    D.product = product;
    const urlBySlot = new Map(imgs.images.map((i) => [i.slot, i.url]));
    const cleared = new Set(imgs.clearedSlots);
    D.images = product ? [0, 1, 2, 3].filter((s) => !cleared.has(s)).map((s) => urlBySlot.get(s) ?? PM.productImage.getProductImageUrl(product.id, s)).filter((u) => u !== undefined) : [];
    if (product?.categoryReference)
      for (const root of tree) {
        if (root.id === product.categoryReference) {
          D.categoryName = root.name;
          break;
        }
        const child = root.children.find((c) => c.id === product.categoryReference);
        if (child) {
          D.categoryName = child.name;
          break;
        }
      }
    D.requiredStock = product ? demand[product.articleNumber] : undefined;
    D.isLoading = false;
    D.error = null;
  } catch (err) {
    if (my !== seq) return;
    D.isLoading = false;
    D.error = err;
    onNotify(`Something went wrong: ${err.message}`, "error");
  }
  K.update();
}
function derived() {
  const product = D.product;
  const [secondaryUnit, baseUnit] = (product.measurement ?? "").split("-");
  const priceMap = product.priceMap ?? {};
  const offer = product.offerPriceMap ?? {};
  const priceAt = (u) => offer[u] ?? priceMap[u];
  const tax = product.tax;
  const gst = PM.taxUtil.addGstToExclusivePrice;
  const smallest = (secondaryUnit ? priceAt(secondaryUnit) : undefined) ?? product.price;
  const resolvedUnit = PM.catalogueDrawer.resolveOrderingUnit(product);
  const resolved = (resolvedUnit ? priceAt(resolvedUnit) : undefined) ?? (product.price !== undefined ? PM.unitLevel.convertUnitPrice({ price: product.price, boxes: product.boxes, pallets: product.pallets }, 0, PM.unitLevel.getPriceCalculationUnitIndex()) : undefined);
  const selling = resolved !== undefined ? gst(resolved, tax) : undefined;
  const packaging = [];
  if (secondaryUnit && smallest !== undefined) packaging.push({ unit: secondaryUnit, badge: "Smallest Unit", conversion: `1 ${secondaryUnit}`, priceInclTax: gst(smallest, tax) });
  if (baseUnit) {
    const baseEx = priceAt(baseUnit) ?? (smallest !== undefined ? smallest * (product.boxes ?? 1) : undefined);
    if (baseEx !== undefined) packaging.push({ unit: baseUnit, badge: "Base Unit", conversion: `1 ${baseUnit} = ${product.boxes ?? "—"} ${secondaryUnit}`, priceInclTax: gst(baseEx, tax) });
  }
  const rawTotal = product.stock !== undefined ? Math.max(0, product.stock) : null;
  const idx = PM.unitLevel.getPriceCalculationUnitIndex();
  const at = (q) => PM.unitLevel.resolveStockAtUnitIndex(q, product.boxes, product.pallets, idx);
  const totalStock = rawTotal !== null ? at(rawTotal) : null;
  let availableStock, reservedStock;
  if (rawTotal !== null) {
    const req = D.requiredStock ?? 0;
    availableStock = at(Math.max(0, rawTotal - req));
    reservedStock = at(Math.max(0, Math.min(rawTotal, req)));
  }
  return { secondaryUnit, baseUnit, selling, packaging, totalStock, availableStock, reservedStock };
}

// ---- ProductDetailPage -----------------------------------------------------------------------
const entityLabel = isRawRoute ? "Raw Material" : "Product";
K.on["pdp.edit"] = () => {
  D.isEditOpen = true;
  openProductDrawer("product-drawer", {
    apiClient: api, locationId, catalogueType, productId, onNotify,
    onClose: () => (D.isEditOpen = false),
    onSaved: (saved) => {
      onNotify(`${saved.name} updated`, "success");
      D.isEditOpen = false;
      ws ? ws.load().then(load) : load();
    },
  });
};
K.on["pdp.thumb"] = (i) => (D.selectedImage = Number(i));
const crumb = (last) => `<ol class="flex min-w-0 items-center gap-2 text-sm text-gray-500"><li><a href="${listPath}" class="font-medium hover:text-green-600">${entityLabel}</a></li>${K.icon("FiChevronRight", "flex-none")}${last}</ol>`;
const info = (label, value) => `<div class="min-w-0"><p class="text-sm text-gray-500">${label}</p><p class="mt-0.5 truncate font-semibold text-gray-900 dark:text-gray-100" title="${K.esc(value)}">${K.esc(value)}</p></div>`;
const sectionTitle = (iconName, title) => `<h2 class="flex items-center gap-2 text-lg font-bold text-gray-900 dark:text-white"><span class="text-green-500">${K.icon(iconName)}</span>${title}</h2>`;
const metric = (iconName, value, label, warning) => `<div class="rounded-xl border border-gray-200 px-2 py-4 text-center dark:border-gray-700"><span class="mx-auto flex h-10 w-10 items-center justify-center rounded-full ${warning ? "bg-orange-100 text-orange-500" : "bg-green-100 text-green-600"}">${K.icon(iconName)}</span><p class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">${value}</p><p class="text-xs text-gray-500 sm:text-sm">${label}</p></div>`;
const bar = (w) => `<div class="${w} animate-pulse rounded bg-gray-200 dark:bg-gray-700"></div>`;

function skeleton() {
  return `<div class="mx-auto w-full max-w-screen-2xl pb-8" data-testid="product-detail-skeleton">
    <div class="flex flex-col gap-4 pb-5 pt-5 sm:flex-row sm:items-center sm:justify-between">${crumb(`<li class="h-4 w-32 animate-pulse rounded bg-gray-200 dark:bg-gray-700"></li>`)}</div>
    <section class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-5 lg:p-6"><div class="grid gap-5 sm:gap-6 lg:grid-cols-[230px_minmax(0,1fr)_220px]">
      <div class="flex h-52 items-center justify-center overflow-hidden rounded-xl border border-gray-200 bg-gray-50 p-3 dark:border-gray-700 dark:bg-gray-900">${ProductImage({ productId, alt: "", className: "block h-full w-full object-contain" })}</div>
      <div class="min-w-0 space-y-3">${bar("h-7 w-2/3")}${bar("h-4 w-1/2")}<div class="mt-5 grid grid-cols-2 gap-x-5 gap-y-5 xl:grid-cols-3">${Array.from({ length: 6 }, () => `<div class="space-y-1.5">${bar("h-3 w-16")}${bar("h-4 w-24")}</div>`).join("")}</div></div>
      <div class="grid grid-cols-2 gap-5 border-t border-gray-200 pt-5 lg:block lg:border-l lg:border-t-0 lg:pl-6 lg:pt-0 dark:border-gray-700"><div class="space-y-1.5">${bar("h-4 w-28")}${bar("h-8 w-20")}</div></div>
    </div></section>
    <div class="mt-5 grid gap-5 xl:grid-cols-2">${[0, 1].map(() => `<section class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">${bar("h-5 w-40")}<div class="mt-4 h-24 animate-pulse rounded-xl bg-gray-100 dark:bg-gray-900"></div></section>`).join("")}</div>
  </div>`;
}

function render() {
  if (!isRawRoute && ws && !D.isLoading && D.product) return renderV6();
  if (D.error) return `<p role="alert" data-testid="product-detail-error">Something went wrong: ${K.esc(D.error.message)}</p>`;
  if (D.isLoading) return skeleton();
  if (!D.product) return `<p role="alert" data-testid="product-detail-not-found">Not found.</p>`;
  const product = D.product;
  const d = derived();
  const name = PM.text.toTitleCase(product.name);
  const editBtn = (mobile) => `<button type="button" data-testid="${mobile ? "product-detail-edit-btn-mobile" : "product-detail-edit-btn"}" data-on-click="pdp.edit" class="inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-green-500 bg-white px-4 text-sm font-semibold text-green-600 transition hover:bg-green-50 dark:bg-gray-800 ${mobile ? "w-full sm:hidden" : "hidden sm:inline-flex"}">${K.icon("FiEdit2")} Edit ${entityLabel}</button>`;
  const fmt = PM.format;
  const taxPct = Number(product.tax || 0);
  return `<div class="mx-auto w-full max-w-screen-2xl pb-8">
    <div class="flex flex-col gap-4 pb-5 pt-5 sm:flex-row sm:items-center sm:justify-between">${crumb(`<li class="truncate font-semibold text-gray-900 dark:text-gray-100">${K.esc(name)}</li>`)}${editBtn(false)}</div>
    <div class="space-y-5">
      <section class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-5 lg:p-6"><div class="grid gap-5 sm:gap-6 lg:grid-cols-[230px_minmax(0,1fr)_220px]">
        <div><div class="flex h-52 items-center justify-center overflow-hidden rounded-xl border border-gray-200 bg-gray-50 p-3 dark:border-gray-700 dark:bg-gray-900">${ProductImage({ productId: product.id, directUrl: D.images[D.selectedImage], alt: name, className: "block h-full w-full object-contain" })}</div>
          ${D.images.length > 1 ? `<div class="mt-3 flex h-12 items-stretch gap-2 overflow-hidden">${D.images.map((img, i) => `<button data-key="${K.esc(img)}-${i}" type="button" data-testid="product-detail-thumbnail-${i}" data-on-click="pdp.thumb|${i}" class="h-12 min-w-0 flex-1 overflow-hidden rounded-lg border-2 bg-gray-50 p-1 ${D.selectedImage === i ? "border-green-500" : "border-gray-200"}">${ProductImage({ productId: product.id, directUrl: img, alt: "", className: "block h-full w-full object-contain" })}</button>`).join("")}</div>` : ""}</div>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-3"><h1 class="text-2xl font-bold text-gray-900 dark:text-white">${K.esc(name)}</h1><span class="rounded-full px-3 py-1 text-xs font-semibold ${product.status === "ACTIVE" ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}">${product.status === "ACTIVE" ? "Active" : "Hidden"}</span></div>
          ${product.description ? `<p class="mt-2 line-clamp-2 text-sm text-gray-500">${K.esc(product.description)}</p>` : ""}
          <div class="mt-4 sm:hidden">${editBtn(true)}</div>
          <div class="mt-5 grid grid-cols-2 gap-x-5 gap-y-5 xl:grid-cols-3">${info("SKU / Article No.", product.articleNumber)}${info("Category", D.categoryName ?? "—")}${info("Brand", product.brand ?? "—")}${info("Unit (Smallest)", d.secondaryUnit || "—")}${info("Base Unit", d.baseUnit || "—")}${info("Barcode", product.barcode ?? "—")}</div>
          ${product.tags?.length ? `<div class="mt-5 flex flex-wrap gap-2">${product.tags.map((t) => `<span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600 dark:bg-gray-700 dark:text-gray-300">${K.esc(t)}</span>`).join("")}</div>` : ""}
        </div>
        <div class="grid grid-cols-2 gap-5 border-t border-gray-200 pt-5 lg:block lg:border-l lg:border-t-0 lg:pl-6 lg:pt-0 dark:border-gray-700">
          <div><p class="text-sm text-gray-500">${isRawRoute ? "Purchasing Price (Incl. tax)" : "Selling Price (Incl. tax)"}</p><p class="mt-1 text-2xl font-bold text-gray-900 dark:text-white lg:text-3xl">${d.selling !== undefined ? K.esc(fmt.formatPrice(d.selling)) : "—"}</p></div>
          <div class="border-l border-gray-200 pl-5 lg:mt-6 lg:border-l-0 lg:pl-0 dark:border-gray-700"><p class="text-sm text-gray-500">Tax Rate</p><p class="mt-1 text-xl font-bold text-gray-900 dark:text-white">${taxPct}%</p></div>
        </div>
      </div></section>
      <div class="grid gap-5 xl:grid-cols-2">
        <section class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">${sectionTitle("FiLayers", "Packaging &amp; Units")}
          <div class="mt-4 overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700"><div class="grid grid-cols-[1fr_1.35fr_auto] gap-3 bg-gray-50 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-500 dark:bg-gray-900"><span>Unit</span><span>Conversion</span><span>Price (${taxPct}% Incl. tax)</span></div>
            ${d.packaging.length === 0 ? `<p class="px-4 py-3 text-sm text-gray-400">No unit configured yet.</p>` : ""}
            ${d.packaging.map((r) => `<div data-key="${r.badge}" class="grid grid-cols-[1fr_1.35fr_auto] items-center gap-3 border-t border-gray-200 px-4 py-3 text-sm dark:border-gray-700"><div class="font-semibold text-gray-900 dark:text-white">${K.esc(r.unit)}<span class="ml-2 hidden rounded bg-green-100 px-2 py-1 text-xs text-green-700 sm:inline">${r.badge}</span></div><span class="text-gray-600 dark:text-gray-300">${K.esc(r.conversion)}</span><span class="font-semibold text-gray-900 dark:text-white">${K.esc(fmt.formatPrice(r.priceInclTax))}</span></div>`).join("")}
          </div></section>
        <section class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">${sectionTitle("FiPackage", "Inventory Summary")}
          <div class="mt-4 grid gap-3 ${isRawRoute ? "grid-cols-1" : "grid-cols-3"}">${isRawRoute ? metric("FiCheckCircle", d.availableStock ?? 0, "Available Stock") : metric("FiBox", d.totalStock ?? 0, "Total Stock") + metric("FiCheckCircle", d.availableStock ?? 0, "Available Stock") + metric("FiLock", d.reservedStock ?? 0, "Stock Reserved In Order", true)}</div></section>
      </div>
    </div>
    ${D.isEditOpen ? ProductDrawer("product-drawer") : ""}
  </div>`;
}

// ---- v6 Finished Goods detail (Addendum 007, iteration 2) ------------------------------------
let ws = null;
const V = { tab: "overview", more: null };
const TABS = [["overview", "Overview"], ["pricing", "Pricing"], ["units", "Units & Packaging"], ["inventory", "Inventory"], ["customers", "Customers"], ["catalogues", "Catalogues"], ["orders", "Orders"], ["activity", "Activity"]];
K.on["v6.tab"] = (t) => (V.tab = t);
K.on["v6.more"] = (_, ev, el) => (V.more = V.more ? null : el.getBoundingClientRect());
const NA = (what, why) => `<div class="rounded-xl border border-dashed border-gray-300 px-5 py-8 text-center dark:border-gray-600"><p class="text-sm font-semibold text-gray-500">${what} — not available yet</p><p class="mt-1 text-xs text-gray-400">${why}</p></div>`;
const card = (title, icon, body, action = "") => `<section class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800"><div class="flex items-center justify-between gap-3">${sectionTitle(icon, title)}${action}</div><div class="mt-4">${body}</div></section>`;
const actBtn = (action, label, icon) => `<button type="button" data-on-click="fg.act|${action}|${productId}" data-testid="v6-act-${action}" class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-gray-200 px-3 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">${K.icon(icon, "h-4 w-4")}${label}</button>`;

// Units chain: stock and prices are stored at the smallest unit; each step up multiplies (boxes, pallets).
function unitChain(p) {
  const units = (p.measurement ?? "").split("-").filter(Boolean);
  const steps = [null, p.boxes || 1, p.pallets || 1];
  return units.map((u, i) => ({ unit: u, per: steps[i], total: steps.slice(1, i + 1).reduce((a, b) => a * b, 1) }));
}

function renderV6() {
  const { p, i, catalogues, recipients, dupGroups, attention, activity } = ws.forProduct(productId);
  if (!p || !i) return `<p role="alert">Not found.</p>`;
  const d = derived();
  const fmt = PM.format;
  const money = (n) => (n === undefined || n === null ? "—" : K.esc(fmt.formatPrice(n)));
  const name = PM.text.toTitleCase(p.name);
  const chain = unitChain(p);
  const pill = FG_STATUS_PILL[p.status] ?? FG_STATUS_PILL.DRAFT;
  const inCats = i.catalogues;
  const customers = recipients ? [...new Map(inCats.flatMap((c) => (recipients[c.id] ?? []).map((r) => [r.id, { ...r, catalogue: c.name }]))).values()] : null;
  const entryOf = (c) => c.products.find((e) => e.id === p.id);
  const kv = (rows) => `<dl class="grid grid-cols-[140px_minmax(0,1fr)] gap-y-2.5 text-sm">${rows.map(([k, v]) => `<dt class="text-gray-500">${k}</dt><dd class="font-medium text-gray-900 dark:text-gray-100">${v}</dd>`).join("")}</dl>`;
  let body = "";
  switch (V.tab) {
    case "overview":
      body = `<div class="grid gap-5 xl:grid-cols-2">
        ${card("Basic information", "FiInfo", kv([["Product name", K.esc(name)], ["SKU", K.esc(p.articleNumber || "—")], ["Barcode", p.barcode ? K.esc(p.barcode) : '<span class="text-amber-600">Missing</span>'], ["Brand", K.esc(p.brand || "—")], ["Supplier", i.supplier ? `${K.esc(i.supplier)} <span class="text-[10px] text-amber-600">proposed field</span>` : "—"], ["Category", i.cat ? K.esc(i.cat) : '<span class="text-amber-600">Missing</span>'], ["Tax", i.tax === null ? '<span class="text-red-600">Missing</span>' : `${i.tax}%`], ["Description", K.esc(p.description || "—")]]))}
        ${card("Operational summary", "FiPackage", kv([["Selling price", `${money(i.price)} <span class="text-xs text-gray-500">(${money(d.selling)} incl. tax)</span>`], ["MRP", money(i.mrp)], ["Stock", `${p.stock ?? 0} ${K.esc(chain[0]?.unit ?? "")} <span class="text-xs text-gray-500">· this location</span>`], ["Units in open orders", String(i.inOrders)], ["Customers", customers ? String(customers.length) : '<span class="text-gray-400">Not available</span>'], ["Catalogues", String(inCats.length)], ["Tags", (p.tags ?? []).map((t) => `<span class="mr-1 rounded-full bg-gray-100 px-2 py-0.5 text-xs dark:bg-gray-700">${K.esc(t)}</span>`).join("") || "—"]]))}
      </div>
      ${attention.length ? `<div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm dark:border-amber-900/40 dark:bg-amber-900/10" data-testid="v6-attention"><p class="flex items-center gap-2 font-semibold text-amber-800 dark:text-amber-300">${K.icon("AlertTriangle", "h-4 w-4")}Needs attention</p><ul class="mt-1 list-disc pl-6 text-amber-800/90 dark:text-amber-300/90">${attention.map((a) => `<li>${K.esc(a)}</li>`).join("")}</ul>${dupGroups.length ? `<p class="mt-2 text-xs text-amber-800 dark:text-amber-300">Possible duplicate of: ${dupGroups.flatMap((g) => g.items.filter((x) => x.id !== p.id).map((x) => `<a class="font-semibold underline" href="product-detail.html?id=${x.id}">${K.esc(x.name)}</a> (${g.reason.toLowerCase()})`)).join(", ")}</p>` : ""}</div>` : ""}`;
      break;
    case "pricing":
      body = card("Pricing", "IndianRupee", `<div class="grid gap-3 sm:grid-cols-3">${[["Standard selling price", money(i.price), `${money(d.selling)} incl. ${i.tax ?? 0}% tax`], ["MRP", money(i.mrp), i.mrp !== undefined && i.price > i.mrp ? '<span class="text-red-600">Selling price is above MRP</span>' : ""], ["Cost price", p.costPrice ? money(p.costPrice) : "—", p.costPrice && i.price ? `Margin ${(((i.price - p.costPrice) / i.price) * 100).toFixed(1)}%` : ""]].map(([l, v, sub]) => `<div class="rounded-xl border border-gray-200 p-4 dark:border-gray-700"><p class="text-xs text-gray-500">${l}</p><p class="mt-1 text-xl font-bold text-gray-900 dark:text-white">${v}</p><p class="text-xs text-gray-500">${sub}</p></div>`).join("")}</div>
        <h3 class="mb-2 mt-6 text-sm font-semibold text-gray-700 dark:text-gray-200">Catalogue (customer) prices</h3>
        ${inCats.length ? `<table class="w-full text-sm" data-testid="v6-catalogue-prices"><thead class="text-xs uppercase text-gray-500"><tr><th class="py-2 text-left">Catalogue</th><th class="py-2 text-left">Price</th><th class="py-2 text-left">Offer price</th><th class="py-2 text-left"></th></tr></thead><tbody>${inCats.map((c) => { const e = entryOf(c); const custom = i.custom.some((x) => x.id === c.id); return `<tr class="border-t border-gray-100 dark:border-gray-700"><td class="py-2">${K.esc(c.name)}</td><td class="py-2 font-semibold">${money(e.price)}</td><td class="py-2">${money(e.offerPrice)}</td><td class="py-2">${custom ? '<span class="rounded bg-amber-50 px-2 py-0.5 text-xs text-amber-700">differs from standard</span>' : '<span class="text-xs text-gray-400">same as standard (stored separately)</span>'}</td></tr>`; }).join("")}</tbody></table>` : `<p class="text-sm text-gray-500">Not in any customer catalogue.</p>`}
        <p class="mt-4 text-xs text-gray-400">Price lists and schemes have no data source yet.</p>`, `<div class="flex gap-2">${actBtn("price", "Change price", "IndianRupee")}${actBtn("customerPrice", "Catalogue price", "Users")}</div>`);
      break;
    case "units":
      body = card("Units & packaging", "FiLayers", chain.length ? `<div class="flex flex-col items-start gap-6 md:flex-row"><ol class="flex flex-col items-center" data-testid="v6-unit-chain">${chain.map((u, idx) => `${idx ? `<li class="py-1 text-xs font-semibold text-gray-500">↓ ×${u.per}</li>` : ""}<li class="min-w-[120px] rounded-lg border-2 ${idx === 0 ? "border-green-500 bg-green-50 dark:bg-green-900/20" : "border-gray-200 dark:border-gray-600"} px-4 py-2 text-center text-sm font-bold uppercase text-gray-900 dark:text-white">${K.esc(u.unit)}<span class="block text-[10px] font-medium normal-case text-gray-500">${["Smallest unit", "Base unit", "Largest unit"][idx]}</span></li>`).join("")}</ol>
          <div class="min-w-0 flex-1"><p class="mb-2 text-sm font-semibold text-gray-700 dark:text-gray-200">Conversions</p><ul class="space-y-1 text-sm text-gray-700 dark:text-gray-300">${chain.slice(1).map((u, idx) => `<li>1 ${K.esc(u.unit)} = ${u.per} ${K.esc(chain[idx].unit)}</li>`).join("")}${chain.length > 2 ? `<li class="font-semibold">1 ${K.esc(chain[2].unit)} = ${chain[2].total} ${K.esc(chain[0].unit)} <span class="text-xs font-normal text-gray-500">(calculated)</span></li>` : ""}</ul>
          <div class="mt-5 overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700"><div class="grid grid-cols-[1fr_1.35fr_auto] gap-3 bg-gray-50 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-500 dark:bg-gray-900"><span>Unit</span><span>Conversion</span><span>Price (incl. tax)</span></div>${d.packaging.map((r) => `<div class="grid grid-cols-[1fr_1.35fr_auto] items-center gap-3 border-t border-gray-200 px-4 py-3 text-sm dark:border-gray-700"><span class="font-semibold">${K.esc(r.unit)}</span><span class="text-gray-600 dark:text-gray-300">${K.esc(r.conversion)}</span><span class="font-semibold">${money(r.priceInclTax)}</span></div>`).join("") || `<p class="px-4 py-3 text-sm text-gray-400">No prices per unit yet.</p>`}</div></div></div>` : `<p class="text-sm text-amber-600">No unit configured — use Edit to set units and conversions.</p>`, `<button type="button" data-on-click="pdp.edit" class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-gray-200 px-3 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">${K.icon("FiEdit2", "h-4 w-4")}Edit units</button>`);
      break;
    case "inventory":
      body = card("Inventory", "FiPackage", `<div class="grid grid-cols-3 gap-3">${metric("FiBox", p.stock ?? 0, `Total (${K.esc(chain[0]?.unit ?? "units")})`, (p.stock ?? 0) <= 0)}${metric("FiCheckCircle", Math.max(0, (p.stock ?? 0) - i.inOrders), "Can sell")}${metric("FiLock", i.inOrders, "Reserved in orders", true)}</div>
        <table class="mt-5 w-full text-sm"><thead class="text-xs uppercase text-gray-500"><tr><th class="py-2 text-left">Location</th><th class="py-2 text-right">Stock</th><th class="py-2 text-right">Reorder level</th></tr></thead><tbody><tr class="border-t border-gray-100 dark:border-gray-700"><td class="py-2">This location</td><td class="py-2 text-right font-semibold">${p.stock ?? 0}</td><td class="py-2 text-right">${p.stockThreshold ?? '<span class="text-gray-400">Not set (5)</span>'}</td></tr></tbody></table>
        <p class="mt-2 text-xs text-gray-400">Per-warehouse stock is a proposed capability — one location today.</p>`, `<div class="flex gap-2">${actBtn("stock", "Adjust stock", "Package")}${actBtn("reorder", "Reorder level", "AlertTriangle")}</div>`);
      break;
    case "customers":
      body = card("Customers", "FiUsers", customers ? (customers.length ? `<table class="w-full text-sm"><thead class="text-xs uppercase text-gray-500"><tr><th class="py-2 text-left">Customer</th><th class="py-2 text-left">Catalogue</th><th class="py-2 text-left">Phone</th></tr></thead><tbody>${customers.map((c) => `<tr class="border-t border-gray-100 dark:border-gray-700"><td class="py-2">${K.esc(c.name)}</td><td class="py-2">${K.esc(c.catalogue)}</td><td class="py-2 text-gray-500">${K.esc(c.phone ?? "")}</td></tr>`).join("")}</tbody></table>` : `<p class="text-sm text-gray-500">No customers are on a catalogue with this product.</p>`) : NA("Customers", "Turn on “seed: catalogues have customers” in Discovery controls; Development needs a customer ↔ catalogue read port."));
      break;
    case "catalogues":
      body = card("Catalogues", "BookOpen", inCats.length ? `<ul class="divide-y divide-gray-100 dark:divide-gray-700">${inCats.map((c) => `<li class="flex items-center justify-between py-2.5 text-sm"><span class="font-medium">${K.esc(c.name)}</span><span class="text-gray-500">${money(entryOf(c).price)}${i.custom.some((x) => x.id === c.id) ? ' <span class="ml-1 rounded bg-amber-50 px-1.5 text-xs text-amber-700">custom</span>' : ""}</span></li>`).join("")}</ul>` : `<p class="text-sm text-gray-500">Not in any customer catalogue.</p>`, `<div class="flex gap-2">${actBtn("catalogueAdd", "Add to catalogue", "Plus")}${inCats.length ? actBtn("catalogueRemove", "Remove", "X") : ""}</div>`);
      break;
    case "orders":
      body = card("Orders", "FiList", `<p class="text-sm text-gray-700 dark:text-gray-300"><b>${i.inOrders}</b> ${K.esc(chain[0]?.unit ?? "units")} in open orders.</p><div class="mt-4">${NA("Order list", "This module only reads the reserved quantity; open-order lines live in the orders module.")}</div>`);
      break;
    case "activity":
      body = card("Activity", "History", activity.length ? `<ul class="space-y-2">${activity.map((a) => `<li class="rounded-lg border border-gray-200 p-3 text-sm dark:border-gray-700"><div class="flex justify-between gap-2"><span class="font-semibold">${K.esc(a.action)}${a.undone ? ' <span class="text-xs font-normal text-gray-400">(undone)</span>' : ""}</span><span class="text-xs text-gray-500">${a.at.toLocaleString()}</span></div><p class="text-xs text-gray-600 dark:text-gray-300">${K.esc(a.detail)} · ${K.esc(a.rows.find(([n]) => n === p.name)?.[2] ?? "")}</p></li>`).join("")}</ul>` : NA("History", "Changes made on this page appear here for this session; a persistent audit log is proposed."));
      break;
  }
  const more = V.more ? DropdownMenu("v6-more", { anchor: V.more, anchorSelector: '[data-testid="v6-more-btn"]', onClose: () => (V.more = null), testId: "v6-more-menu", children: [["status", "Change status", "CircleDot"], ["price", "Change price", "IndianRupee"], ["tax", "Change tax", "Percent"], ["category", "Change category", "FolderInput"], ["tags", "Add / remove tags", "Tag"], ["stock", "Adjust stock", "Package"], ["catalogueAdd", "Add to catalogue", "BookOpen"]].map(([a, l, ic]) => DropdownMenuItem({ action: `v6.moreAct|${a}`, icon: K.icon(ic, "h-4 w-4"), label: l, testId: `v6-more-${a}` })).join("") }) : "";
  return `<div class="mx-auto w-full max-w-screen-2xl pb-8">
    <div class="pb-4 pt-5"><a href="${listPath}" class="inline-flex items-center gap-1 text-sm font-medium text-green-700 hover:underline">${K.icon("FiArrowLeft", "h-4 w-4")}Back to Products</a></div>
    <section class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-5"><div class="flex flex-col gap-4 sm:flex-row sm:items-center">
      <div class="h-20 w-20 shrink-0 overflow-hidden rounded-xl border border-gray-200 bg-gray-50 p-1 dark:border-gray-700">${ProductImage({ productId: p.id, directUrl: D.images[0], alt: name, className: "block h-full w-full object-contain" })}</div>
      <div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-3"><h1 class="text-2xl font-bold text-gray-900 dark:text-white" data-testid="v6-name">${K.esc(name)}</h1><span data-testid="v6-status" class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ${pill}"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>${K.esc(FG_STATUS_LABEL[p.status] ?? p.status)}</span></div>
        <p class="mt-1 text-sm text-gray-500">SKU: ${K.esc(p.articleNumber || "—")} · Brand: ${K.esc(p.brand || "—")} · Category: ${K.esc(i.cat ?? "—")}</p></div>
      <div class="flex gap-2"><button type="button" data-testid="product-detail-edit-btn" data-on-click="pdp.edit" class="inline-flex h-10 items-center gap-2 rounded-lg border border-green-500 bg-white px-4 text-sm font-semibold text-green-600 hover:bg-green-50 dark:bg-gray-800">${K.icon("FiEdit2")} Edit</button><button type="button" data-on-click="v6.more" data-testid="v6-more-btn" class="inline-flex h-10 items-center gap-1 rounded-lg border border-gray-200 bg-white px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200">More${K.icon("ChevronDown", "h-4 w-4")}</button></div>
    </div>
    <nav class="-mb-5 mt-5 flex gap-1 overflow-x-auto border-t border-gray-100 pt-2 dark:border-gray-700" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" aria-selected="${V.tab === k}" data-on-click="v6.tab|${k}" data-testid="v6-tab-${k}" class="whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition ${V.tab === k ? "border-green-600 text-green-700" : "border-transparent text-gray-500 hover:text-gray-800 dark:hover:text-gray-200"}">${l}</button>`).join("")}</nav></section>
    <div class="mt-5" data-testid="v6-tab-body">${body}</div>
    ${more}
    ${ws.renderModals()}
    ${D.isEditOpen ? ProductDrawer("product-drawer") : ""}
  </div>`;
}
K.on["v6.moreAct"] = (a) => ((V.more = null), K.on["fg.act"](`${a}|${productId}`));

Boot.start(isRawRoute ? "rawMaterials" : "finishedGoods", async (client, el) => {
  api = client;
  locationId = Boot.locationId;
  if (!isRawRoute) {
    const S = { products: [], items: [] };
    ws = createFinishedGoodsWorkspace({
      api, locationId, onNotify, S, detailPath: (id) => `product-detail.html?id=${encodeURIComponent(id)}`,
      openDrawer: () => K.on["pdp.edit"](), isInlineEditing: () => false, requestBulkDelete: () => {}, beginInlineEdit: () => {},
      refresh: async () => (await ws.load(), await load()),
    });
    await ws.load();
  }
  K.app(el, render);
  load();
});
</script>
</body>
</html>
