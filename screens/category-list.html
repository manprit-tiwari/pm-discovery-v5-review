<!doctype html>
<!--
  DISCOVERY v5 SCREEN — Categories (Addendum 006: baseline sync to Development).
  Ports, element for element: CategoryListShell, useCategoryListController, CategoryDrawer,
  CategoryBulkImportExport (+ shared DeleteModal, DiscardChangesModal, SlideDrawer, FormModal).
  Mounted as the host mounts it (storefront-frontend pages/CategoryManagement.jsx):
  showHeading={false}, onNotify → host toasts. Data: sandbox seed (seed.catalogues — the
  sandbox's /categories route shares the catalogue client).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories — Discovery v5</title>
<link rel="stylesheet" href="../assets/module.css?v=6.3">
<script src="../assets/pm-core.js?v=6.3"></script>
<script src="../assets/ui/icons.js?v=6.3"></script>
<script src="../assets/ui/kit.js?v=6.3"></script>
<script src="../assets/ui/boot.js?v=6.3"></script>
</head>
<body>
<script>
const SHOW_HEADING = false;
let api, locationId;
const onNotify = (m, t) => Boot.onNotify(m, t);
const mc = () => PM.mapCategory;

// ---- useCategoryListController -------------------------------------------------------------
const C = { rawTree: [], isLoading: true, error: null, searchInput: "", searchDraft: "", pendingDelete: null, drawer: null, showSubcategories: false, expandedRoots: new Set(), thumbFailed: {} };
let seqNo = 0;
async function load() {
  const seq = ++seqNo;
  C.isLoading = true;
  K.update();
  try {
    const result = await api.listCategories(locationId);
    if (seq !== seqNo) return;
    C.rawTree = result;
    C.isLoading = false;
    C.error = null;
  } catch (err) {
    if (seq !== seqNo) return;
    C.isLoading = false;
    C.error = err;
  }
  K.update();
}
const refresh = () => load();
function tree() {
  const q = C.searchInput.trim().toLowerCase();
  if (!q) return C.rawTree;
  return C.rawTree.map((r) => ({ ...r, children: r.children.filter((c) => c.name.toLowerCase().includes(q)) })).filter((r) => r.name.toLowerCase().includes(q) || r.children.length > 0);
}
const create = async (input) => (await api.createCategory(locationId, mc().fromCategoryFormInput(input)), refresh());
const update = async (id, input) => (await api.updateCategory(id, mc().fromCategoryFormInput(input)), refresh());
const remove = async (id) => (await api.deleteCategory(id), refresh());

// ---- CategoryListShell ----------------------------------------------------------------------
const applySearch = K.debounce((v) => ((C.searchInput = v), K.update()), 400);
K.on["cl.search"] = (_, ev) => {
  C.searchDraft = ev.target.value;
  applySearch(C.searchDraft);
};
K.on["cl.switch"] = () => {
  C.showSubcategories = !C.showSubcategories;
  if (!C.showSubcategories) C.expandedRoots = new Set();
};
K.on["cl.expand"] = (id) => {
  const n = new Set(C.expandedRoots);
  n.has(id) ? n.delete(id) : n.add(id);
  C.expandedRoots = n;
};
K.on["cl.add"] = () => openDrawer({ mode: "create" });
K.on["cl.edit"] = (id) => openDrawer({ mode: "edit", id });
K.on["cl.delete"] = (id) => {
  const node = findNode(id);
  C.pendingDelete = { id, name: node.name };
};
K.on["cl.thumbError"] = (key) => (C.thumbFailed[key] = true);
function findNode(id) {
  for (const root of tree()) {
    if (root.id === id) return root;
    const child = root.children.find((c) => c.id === id);
    if (child) return child;
  }
  return undefined;
}

function thumbnail(node) {
  // CategoryThumbnail: resets `failed` whenever `icon` changes.
  const key = `${node.id}|${node.icon}`;
  const src = !node.icon || C.thumbFailed[key] ? PM.CATEGORY_IMAGE_FALLBACK_URL : node.icon;
  return `<img src="${K.esc(src)}" alt="" data-testid="category-image-${node.id}" class="mr-2 h-5 w-5 shrink-0 rounded object-cover" data-on-error="cl.thumbError|${K.esc(key)}">`;
}
function renderRow(node, isRoot, rootName) {
  const hasChildren = isRoot && node.children.length > 0;
  const isExpanded = C.expandedRoots.has(node.id);
  const spacer = `<span class="mr-2 inline-block h-5 w-5 shrink-0"></span>`;
  const lead = isRoot && C.showSubcategories
    ? hasChildren
      ? `<button type="button" data-on-click="cl.expand|${node.id}" data-testid="category-toggle-btn-${node.id}" aria-label="${isExpanded ? "Collapse" : "Expand"} ${K.esc(node.name)}" class="mr-2 flex h-5 w-5 shrink-0 items-center justify-center rounded text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-600">${K.icon(isExpanded ? "FiChevronDown" : "FiChevronRight").replace("<svg", `<svg data-testid="category-toggle-icon-${node.id}"`)}</button>`
      : spacer
    : isRoot ? spacer : "";
  return `<tr data-key="${node.id}" data-testid="category-row-${node.id}" class="border-b border-gray-200 hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-700/40">
    <td class="px-4 py-2"><span class="flex items-center text-sm ${isRoot ? "font-semibold" : "pl-6"}">${lead}${thumbnail(node)}<span data-testid="category-name-${node.id}">${K.esc(node.name)}</span></span></td>
    <td class="px-4 py-2 text-sm" data-testid="category-description-${node.id}">${K.esc(node.description || "—")}</td>
    <td class="px-4 py-2 text-sm" data-testid="category-parent-${node.id}">${K.esc(mc().resolveParentCategoryLabel(isRoot, rootName))}</td>
    <td class="px-4 py-2"><span class="flex items-center text-sm font-semibold">${K.icon("FiPackage", "mr-2 text-gray-400")}<span data-testid="category-product-count-${node.id}">${node.productCount}</span></span></td>
    <td class="px-4 py-2"><div class="flex items-center gap-1">
      <button type="button" data-on-click="cl.edit|${node.id}" data-testid="category-edit-btn-${node.id}" class="p-2 text-gray-600 hover:text-green-600 focus:outline-none" aria-label="Edit ${K.esc(node.name)}">${K.icon("FiEdit")}</button>
      <button type="button" data-on-click="cl.delete|${node.id}" data-testid="category-delete-btn-${node.id}" class="p-2 text-gray-600 hover:text-red-600 focus:outline-none" aria-label="Delete ${K.esc(node.name)}">${K.icon("FiTrash2")}</button>
    </div></td></tr>`;
}

function renderList() {
  if (C.error) return `<p role="alert" data-testid="categories-list-error">Something went wrong: ${K.esc(C.error.message)}</p>`;
  const t = tree();
  const sw = C.showSubcategories;
  return `<div>
    ${SHOW_HEADING ? `<h1 data-testid="categories-list-heading" class="mb-4 text-xl font-semibold text-gray-800 dark:text-gray-100">Categories</h1>` : ""}
    <div class="min-w-0 rounded-lg overflow-visible ring-1 ring-black/5 dark:bg-gray-800 mb-4"><div class="p-4 flex flex-col sm:flex-row gap-2">
      ${BulkImportExport()}
      <button type="button" data-on-click="cl.add" data-testid="categories-add-btn" class="inline-flex h-10 items-center justify-center rounded-md border border-transparent bg-green-600 px-4 text-sm font-medium text-white hover:bg-green-700 sm:ml-auto">${K.icon("FiPlus", "mr-1")} Add Category</button>
    </div></div>
    <div class="min-w-0 rounded-lg overflow-visible ring-1 ring-black/5 dark:bg-gray-800 mb-4"><div class="p-4 flex flex-col sm:flex-row sm:items-center gap-3">
      <input type="text" placeholder="Search categories" value="${K.esc(C.searchDraft)}" data-on-input="cl.search" data-testid="categories-search-input" class="block w-full h-10 flex-1 rounded-md border border-gray-200 bg-white px-3 text-sm focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200">
      <div class="flex shrink-0 items-center gap-2">
        <button type="button" role="switch" aria-checked="${sw}" data-on-click="cl.switch" data-testid="categories-show-subcategories-toggle" class="relative h-[22px] w-10 shrink-0 rounded-full transition-colors ${sw ? "bg-green-500" : "bg-gray-300 dark:bg-gray-600"}"><span class="absolute left-0 top-[3px] h-4 w-4 rounded-full bg-white shadow transition-transform ${sw ? "translate-x-[21px]" : "translate-x-[3px]"}"></span></button>
        <span class="whitespace-nowrap text-sm font-semibold text-gray-800 dark:text-gray-100">Show subcategories</span>
      </div>
    </div></div>
    ${C.isLoading
      ? `<p data-testid="categories-list-loading" class="px-4 py-6 text-center text-gray-500 dark:text-gray-400">Loading…</p>`
      : `<div class="w-full overflow-hidden ring-1 ring-black/5 rounded-lg overflow-x-auto"><table class="w-full" data-testid="categories-table">
        <thead class="text-sm font-medium tracking-wide text-left text-zinc-500 uppercase border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:text-gray-400 dark:bg-gray-800"><tr><th class="px-4 py-2">Name</th><th class="px-4 py-2">Description</th><th class="px-4 py-2">Parent Category</th><th class="px-4 py-2">Products</th><th class="px-4 py-2">Actions</th></tr></thead>
        <tbody class="bg-white divide-y divide-gray-100 dark:divide-gray-700 dark:bg-gray-800 text-gray-800 dark:text-gray-400">${t.length === 0
          ? `<tr><td colspan="5" data-testid="categories-list-empty" class="px-4 py-6 text-center text-gray-500 dark:text-gray-400">No categories found.</td></tr>`
          : t.map((root) => renderRow(root, true, root.name) + (sw && C.expandedRoots.has(root.id) ? root.children.map((c) => renderRow(c, false, root.name)).join("") : "")).join("")}</tbody>
      </table></div>`}
    ${C.drawer ? CategoryDrawer(C.drawer) : ""}
    ${DeleteModal("category-delete", { open: C.pendingDelete !== null, title: C.pendingDelete?.name, onConfirm: async () => { const pd = C.pendingDelete; if (!pd) return; await remove(pd.id); onNotify(`Category "${pd.name}" deleted`, "success"); }, onClose: () => (C.pendingDelete = null) })}
  </div>`;
}

// ---- CategoryDrawer -------------------------------------------------------------------------
const ADD_NEW_PARENT = "__add_new_parent__";
function openDrawer(spec) {
  const initial = spec.mode === "edit" ? findNode(spec.id) : undefined;
  C.drawer = {
    mode: spec.mode, id: spec.id, initial,
    name: initial?.name ?? "", description: initial?.description ?? "", parentSelection: initial?.parentCategoryReference ?? "",
    addingNewParent: false, newParentName: "", nameError: null, newParentError: null, saveError: null, isSaving: false,
    confirmingDiscard: false, previewUrl: initial?.icon, newIcon: undefined, imageError: null, isRemovingImage: false,
  };
}
const Dr = () => C.drawer;
const reservedMsg = (v) => `"${v.trim()}" is a reserved system category name and can't be used.`;
function isDirty(d) {
  return d.name !== (d.initial?.name ?? "") || d.description !== (d.initial?.description ?? "") || d.parentSelection !== (d.initial?.parentCategoryReference ?? "") || d.newParentName !== "" || d.newIcon !== undefined;
}
function handleClose() {
  const d = Dr();
  if (isDirty(d)) return (d.confirmingDiscard = true);
  C.drawer = null;
}
K.on["cd.close"] = () => handleClose();
K.on["cd.name"] = (_, ev) => {
  const d = Dr();
  d.name = ev.target.value;
  d.nameError = mc().isReservedCategoryName(d.name) ? reservedMsg(d.name) : null;
};
K.on["cd.newParent"] = (_, ev) => {
  const d = Dr();
  d.newParentName = ev.target.value;
  d.newParentError = mc().isReservedCategoryName(d.newParentName) ? reservedMsg(d.newParentName) : null;
};
K.on["cd.desc"] = (_, ev) => (Dr().description = ev.target.value);
K.on["cd.parent"] = (_, ev) => {
  const d = Dr();
  const value = ev.target.value;
  if (value === ADD_NEW_PARENT) {
    d.addingNewParent = true;
    d.parentSelection = "";
    return;
  }
  Object.assign(d, { addingNewParent: false, newParentName: "", newParentError: null, parentSelection: value });
};
K.on["cd.pickImage"] = (_, ev, el) => el.closest("[data-image-field]").querySelector('input[type="file"]').click();
K.on["cd.imageFile"] = (_, ev) => {
  const file = ev.target.files?.[0];
  ev.target.value = "";
  if (!file) return;
  const d = Dr();
  if (!file.type.startsWith("image/")) return (d.imageError = "Please choose an image file.");
  d.imageError = null;
  const reader = new FileReader();
  reader.onload = () => {
    const uri = typeof reader.result === "string" ? reader.result : "";
    d.previewUrl = uri;
    d.newIcon = uri;
    K.update();
  };
  reader.readAsDataURL(file);
};
K.on["cd.previewError"] = () => (Dr().previewUrl = undefined);
K.on["cd.removeImage"] = async () => {
  const d = Dr();
  d.imageError = null;
  if (d.mode === "edit" && d.initial?.id) {
    d.isRemovingImage = true;
    K.update();
    try {
      await api.removeCategoryImage(d.initial.id);
      d.previewUrl = undefined;
      d.newIcon = undefined;
    } catch (err) {
      d.imageError = err.message || "Failed to remove image";
    } finally {
      d.isRemovingImage = false;
      K.update();
    }
    return;
  }
  d.previewUrl = undefined;
  d.newIcon = undefined;
};
K.on["cd.save"] = async () => {
  const d = Dr();
  const trimmed = d.name.trim();
  if (!trimmed) return (d.nameError = "Category name is required");
  if (mc().isReservedCategoryName(trimmed)) return (d.nameError = reservedMsg(trimmed));
  if (d.addingNewParent && !d.newParentName.trim()) return (d.newParentError = "Parent category name is required");
  if (d.addingNewParent && mc().isReservedCategoryName(d.newParentName)) return (d.newParentError = reservedMsg(d.newParentName));
  d.isSaving = true;
  d.saveError = null;
  K.update();
  try {
    let parentCategoryReference = d.parentSelection || undefined;
    if (d.addingNewParent) parentCategoryReference = (await api.createCategory(locationId, { name: d.newParentName.trim() })).id;
    const input = { name: trimmed, description: d.description.trim() || undefined, parentCategoryReference, icon: d.newIcon };
    // CategoryListShell#onSave
    if (d.mode === "create") {
      await create(input);
      onNotify(`Category "${input.name}" created`, "success");
    } else {
      await update(d.id, input);
      onNotify(`Category "${input.name}" updated`, "success");
    }
    C.drawer = null;
  } catch (err) {
    d.saveError = err.message;
  } finally {
    d.isSaving = false;
    K.update();
  }
};

function CategoryDrawer(d) {
  const parentOptions = mc().rootCategoryOptions(tree()).filter((r) => r.id !== d.initial?.id);
  const lockedRoot = d.mode === "edit" && !d.initial?.parentCategoryReference;
  const row = (inner) => `<div class="grid grid-cols-6 items-start gap-3 mb-6 md:gap-5 lg:gap-6 xl:gap-6">${inner}</div>`;
  const labelCls = "col-span-4 pt-2 text-sm font-medium text-gray-700 dark:text-gray-300 sm:col-span-2";
  const selectValue = lockedRoot ? "" : d.addingNewParent ? ADD_NEW_PARENT : d.parentSelection;
  const opt = (value, label, extra = "") => `<option value="${K.esc(value)}"${K.attr("selected", selectValue === value)}${extra}>${K.esc(label)}</option>`;
  const body = `
    ${row(`<label for="category-name-input" class="${labelCls}">Name <span class="text-red-500">*</span></label>
      <div class="col-span-8 sm:col-span-4"><input id="category-name-input" type="text" value="${K.esc(d.name)}" data-on-input="cd.name" placeholder="Category title" data-testid="category-name-input" class="block h-10 w-full rounded-md border px-3 text-sm focus:outline-none dark:bg-gray-700 dark:text-gray-200 ${d.nameError ? "border-red-400" : "border-gray-300 dark:border-gray-600"}">
      ${d.nameError ? `<p role="alert" data-testid="category-name-error" class="mt-1 text-xs text-red-600">${K.esc(d.nameError)}</p>` : ""}</div>`)}
    ${row(`<label for="category-description-input" class="${labelCls}">Description</label>
      <textarea id="category-description-input" data-on-input="cd.desc" placeholder="Description" rows="3" data-testid="category-description-input" class="col-span-8 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 sm:col-span-4">${K.esc(d.description)}</textarea>`)}
    ${row(`<label for="category-parent-select" class="${labelCls}">Parent Category</label>
      <div class="col-span-8 sm:col-span-4">
        <select id="category-parent-select" data-on-change="cd.parent"${K.attr("disabled", lockedRoot)} data-testid="category-drawer-parent-select" class="block h-10 w-full rounded-md border border-gray-300 px-3 text-sm focus:outline-none dark:border-gray-600 dark:text-gray-200 ${lockedRoot ? "bg-gray-50 text-gray-500 dark:bg-gray-800" : "bg-white dark:bg-gray-700"}">
          ${lockedRoot ? opt("", "This is Parent Category") : opt("", "Select Parent Category", " hidden") + (d.mode === "create" ? opt(ADD_NEW_PARENT, "+ Add New Parent Category", ' style="color:#1d4ed8;font-weight:600"') : "") + parentOptions.map((o) => opt(o.id, o.name)).join("")}
        </select>
        ${d.mode === "create" && !d.addingNewParent && !d.parentSelection ? `<p data-testid="category-drawer-parent-note" class="mt-2 flex gap-2 rounded-md border border-blue-100 bg-blue-50 px-3 py-2 text-xs text-slate-600 dark:border-blue-900 dark:bg-blue-900/20 dark:text-slate-300">${K.icon("FiInfo", "mt-0.5 shrink-0 text-blue-600 dark:text-blue-400")}<span><strong>Note:</strong> If no parent category is selected, this category will be created as a parent category.</span></p>` : ""}
      </div>`)}
    ${d.addingNewParent ? row(`<label for="category-new-parent-input" class="${labelCls}">Parent Category Name <span class="text-red-500">*</span></label>
      <div class="col-span-8 sm:col-span-4"><input id="category-new-parent-input" type="text" value="${K.esc(d.newParentName)}" data-on-input="cd.newParent" placeholder="Enter new parent category name" data-testid="category-new-parent-input" class="block h-10 w-full rounded-md border px-3 text-sm focus:outline-none dark:bg-gray-700 dark:text-gray-200 ${d.newParentError ? "border-red-400" : "border-gray-300 dark:border-gray-600"}">
      ${d.newParentError ? `<p role="alert" data-testid="category-new-parent-error" class="mt-1 text-xs text-red-600">${K.esc(d.newParentError)}</p>` : ""}</div>`) : ""}
    ${row(`<label class="${labelCls}">Image</label>
      <div class="col-span-8 sm:col-span-4" data-image-field>
        <input type="file" accept="image/*" class="hidden" data-testid="category-drawer-image-input" data-on-change="cd.imageFile">
        <div class="relative inline-block h-24 w-24">
          <button type="button"${K.attr("disabled", d.isRemovingImage)} data-on-click="cd.pickImage" data-testid="category-drawer-image-uploader" aria-label="${d.previewUrl ? "Change category image" : "Upload category image"}" class="flex h-full w-full items-center justify-center overflow-hidden rounded-lg ${d.previewUrl ? "border border-gray-100 dark:border-gray-700" : "border-2 border-dashed border-gray-300 bg-gray-50 hover:border-green-400 dark:border-gray-600 dark:bg-gray-700"}">
            ${d.previewUrl ? `<img src="${K.esc(d.previewUrl)}" alt="" data-testid="category-drawer-image-preview" class="h-full w-full object-cover" data-on-error="cd.previewError">` : K.icon("FiPlusCircle", "text-3xl text-green-500")}
          </button>
          ${d.previewUrl ? `<div class="absolute right-0 top-0 z-30 flex gap-1 p-1">
            <button type="button"${K.attr("disabled", d.isRemovingImage)} title="Change image" data-on-click="cd.pickImage" data-testid="category-drawer-image-replace-btn" class="rounded-full bg-white/90 p-1 text-blue-500 shadow-sm ${d.isRemovingImage ? "cursor-not-allowed opacity-50" : ""}">${K.icon("FiEdit", "h-3 w-3")}</button>
            <button type="button"${K.attr("disabled", d.isRemovingImage)} title="${d.isRemovingImage ? "Removing…" : "Remove image"}" data-on-click="cd.removeImage" data-testid="category-drawer-image-remove-btn" class="rounded-full bg-white/90 p-1 text-red-500 shadow-sm ${d.isRemovingImage ? "cursor-not-allowed opacity-50" : ""}">${K.icon("FiXCircle", "h-3 w-3")}</button>
          </div>` : ""}
        </div>
        ${d.imageError ? `<p role="alert" data-testid="category-drawer-image-error" class="mt-1 text-xs text-red-600">${K.esc(d.imageError)}</p>` : ""}
      </div>`)}
    ${d.saveError ? `<p role="alert" data-testid="category-drawer-save-error" class="text-sm text-red-600">${K.esc(d.saveError)}</p>` : ""}`;
  return SlideDrawer("category-drawer", {
    open: true, onClose: handleClose,
    title: d.mode === "create" ? "Add Category" : "Update Category",
    description: d.mode === "create" ? "Add your Product category and necessary information from here" : "Updated your Product category and necessary information from here",
    testId: "category-drawer", dimmed: !d.confirmingDiscard,
    footer: `<button type="button" data-on-click="cd.close" data-testid="category-drawer-cancel-btn" class="inline-flex h-10 flex-1 items-center justify-center rounded-md border border-gray-300 px-4 text-sm font-medium text-red-500 hover:bg-red-50 dark:border-gray-600">Cancel</button>
      <button type="button" data-on-click="cd.save"${K.attr("disabled", d.isSaving)} data-testid="category-drawer-save-btn" class="inline-flex h-10 flex-1 items-center justify-center rounded-md bg-green-600 px-4 text-sm font-medium text-white hover:bg-green-700 disabled:opacity-60">${d.isSaving ? "Saving…" : d.mode === "create" ? "Add Category" : "Update Category"}</button>`,
    children: body,
  }) + DiscardChangesModal("category-discard", { open: d.confirmingDiscard, onCancelDiscard: () => (d.confirmingDiscard = false), onConfirmDiscard: () => ((d.confirmingDiscard = false), (C.drawer = null)) });
}

// ---- CategoryBulkImportExport ---------------------------------------------------------------
const B = { isExporting: false, panelOpen: false, selectedFile: null, preview: null, isImporting: false };
const SAMPLE_ROWS = [["name", "parentCategory", "description"], ["", "Beverages", "Drinks and refreshments"], ["Soft Drinks", "Beverages", ""]];
const downloadCsv = (text, name) => K.download(name, new Blob([text], { type: "text/csv;charset=utf-8" }));
K.on["bie.export"] = async () => {
  B.isExporting = true;
  K.update();
  try {
    downloadCsv(PM.categoryCsv.categoriesToCsv(await api.exportCategoriesCsv(locationId)), "categories.csv");
  } catch (err) {
    onNotify(`Export failed: ${err.message}`, "error");
  } finally {
    B.isExporting = false;
    K.update();
  }
};
K.on["bie.toggle"] = () => (B.panelOpen = !B.panelOpen);
K.on["bie.outside"] = () => (B.panelOpen = false);
K.on["bie.sample"] = () => downloadCsv(PM.csv.toCsv(SAMPLE_ROWS), "categories-sample.csv");
K.on["bie.pick"] = (_, ev, el) => el.parentElement.querySelector('input[type="file"]').click();
K.on["bie.file"] = (_, ev) => {
  const file = ev.target.files?.[0];
  if (file) B.selectedFile = file;
};
K.on["bie.clear"] = (_, ev, el) => {
  ev.stopPropagation();
  B.selectedFile = null;
  const input = el.closest("[data-testid=category-import-panel]")?.querySelector('input[type="file"]');
  if (input) input.value = "";
};
K.on["bie.preview"] = () => {
  if (!B.selectedFile) return;
  const reader = new FileReader();
  reader.onload = () => {
    B.preview = PM.categoryCsv.parseCategoriesCsv(typeof reader.result === "string" ? reader.result : "");
    B.panelOpen = false;
    K.update();
  };
  reader.readAsText(B.selectedFile);
};
K.on["bie.cell"] = (arg, ev) => {
  const [rowNumber, field] = arg.split("|");
  B.preview = {
    ...B.preview,
    rows: B.preview.rows.map((r) => (r.rowNumber !== Number(rowNumber) ? r : PM.categoryCsv.revalidateCategoryRow(Number(rowNumber), { ...r.row, [field]: ev.target.value || undefined }))),
  };
};
K.on["bie.cancel"] = () => (B.preview = null);
K.on["bie.import"] = async () => {
  if (!B.preview) return;
  B.isImporting = true;
  K.update();
  try {
    const results = await api.bulkImportCategories(locationId, B.preview.rows.map((r) => r.row));
    const created = results.filter((r) => r.status === "created").length;
    const updated = results.filter((r) => r.status === "updated").length;
    const skipped = results.filter((r) => r.status === "skipped").length;
    onNotify(`${created} created, ${updated} updated${skipped ? `, ${skipped} skipped` : ""}`, "success");
    B.preview = null;
    B.selectedFile = null;
    refresh();
  } catch (err) {
    onNotify(`Import failed: ${err.message}`, "error");
  } finally {
    B.isImporting = false;
    K.update();
  }
};
function BulkImportExport() {
  const p = B.preview;
  const hasHeaderErrors = p ? p.missingRequiredColumns.length > 0 : false;
  const skipCount = p ? p.rows.filter((r) => r.willSkip).length : 0;
  const cell = (r, field, testSuffix) => `<input value="${K.esc(r.row[field] ?? "")}" data-on-input="bie.cell|${r.rowNumber}|${field}" data-testid="category-import-row-${r.rowNumber}-${testSuffix}" class="w-full rounded border border-gray-200 px-2 py-1 dark:border-gray-600 dark:bg-gray-700">`;
  const modalBody = !p ? "" : `<div class="flex flex-col gap-4">${hasHeaderErrors
    ? `<div role="alert" data-testid="category-import-header-error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-800 dark:bg-red-900/20"><p class="font-semibold">This file is missing required columns:</p><p class="mt-1">${K.esc(p.missingRequiredColumns.join(", "))}</p>${p.unrecognizedColumns.length > 0 ? `<p class="mt-2 text-xs">Unrecognized columns (ignored): ${K.esc(p.unrecognizedColumns.join(", "))}</p>` : ""}</div>`
    : `${skipCount > 0 ? `<p data-testid="category-import-skip-summary" class="text-sm text-amber-600">${skipCount} of ${p.rows.length} row(s) will be skipped (reserved category name).</p>` : ""}
      <div class="max-h-96 overflow-auto rounded-lg ring-1 ring-black/5"><table class="w-full text-sm" data-testid="category-import-preview-table">
        <thead class="bg-gray-50 text-left text-xs uppercase text-gray-500 dark:bg-gray-700 dark:text-gray-300"><tr><th class="px-3 py-2">#</th><th class="px-3 py-2">Name</th><th class="px-3 py-2">Parent Category</th><th class="px-3 py-2">Description</th></tr></thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-700">${p.rows.map((r) => `<tr data-key="${r.rowNumber}" data-testid="category-import-row-${r.rowNumber}" data-status="${r.willSkip ? "skip" : "ok"}"${r.willSkip ? ' class="bg-amber-50 dark:bg-amber-900/10"' : ""}>
          <td class="px-3 py-2 text-gray-400">${r.rowNumber}</td><td class="px-3 py-2">${cell(r, "name", "name")}</td><td class="px-3 py-2">${cell(r, "parentCategory", "parent")}</td>
          <td class="px-3 py-2">${cell(r, "description", "description")}${r.willSkip ? `<span data-testid="category-import-row-${r.rowNumber}-skip-reason" class="ml-2 rounded-full bg-amber-100 px-2 py-0.5 text-xs text-amber-700 dark:bg-amber-900/30 dark:text-amber-400">${K.esc(r.skipReason)}</span>` : ""}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="flex justify-end gap-3">
        <button type="button" data-on-click="bie.cancel" class="inline-flex h-10 items-center rounded-md border border-gray-300 px-4 text-sm font-medium text-gray-700 dark:border-gray-600 dark:text-gray-200">Cancel</button>
        <button type="button" data-on-click="bie.import"${K.attr("disabled", B.isImporting)} data-testid="category-import-confirm-btn" class="inline-flex h-10 items-center rounded-md bg-green-600 px-4 text-sm font-medium text-white hover:bg-green-700 disabled:opacity-60">${B.isImporting ? "Importing…" : "Import"}</button>
      </div>`}</div>`;
  return `<button type="button" data-on-click="bie.export"${K.attr("disabled", B.isExporting)} data-testid="category-export-btn" class="inline-flex h-10 items-center gap-2 rounded-md border border-gray-300 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-60 dark:border-gray-600 dark:text-gray-200">${K.icon("FiUpload")} Export</button>
    <div class="relative inline-block"${B.panelOpen ? ' data-on-outside="bie.outside"' : ""}>
      <button type="button" data-on-click="bie.toggle" data-testid="category-import-btn" class="inline-flex h-10 items-center gap-2 rounded-md border border-gray-300 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">${K.icon("FiDownload")} Import</button>
      ${B.panelOpen ? `<div data-testid="category-import-panel" class="absolute left-0 top-[calc(100%+0.4rem)] z-40 w-72 rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-600 dark:bg-gray-800">
        <input type="file" accept=".csv" class="hidden" data-testid="category-import-file-input" data-on-change="bie.file">
        <div data-on-click="bie.pick" data-testid="category-import-dropzone" class="flex h-10 cursor-pointer items-center justify-center gap-2 rounded-md border border-dashed border-green-600 text-xs text-gray-500 hover:bg-gray-50 dark:border-green-500 dark:hover:bg-gray-700">${B.selectedFile
          ? `<span class="truncate">${K.esc(B.selectedFile.name)}</span><button type="button" data-on-click="bie.clear" data-testid="category-import-dropzone-clear" class="text-red-500 hover:text-red-700" aria-label="Clear selected file">${K.icon("FiX")}</button>`
          : `${K.icon("FiUploadCloud", "text-green-600")} Select Your Categories File`}</div>
        ${B.selectedFile ? `<div class="mt-3 flex justify-center"><button type="button" data-on-click="bie.preview" data-testid="category-import-preview-btn" class="inline-flex h-10 items-center justify-center rounded-md bg-green-600 px-4 text-sm font-medium text-white hover:bg-green-700">+ Import</button></div>` : ""}
        <button type="button" data-on-click="bie.sample" data-testid="category-import-sample-link" class="mt-3 block w-full border-t border-gray-200 pt-3 text-center text-xs text-green-700 hover:underline dark:border-gray-600 dark:text-green-500">Download sample file</button>
      </div>` : ""}
    </div>
    ${FormModal("category-import-preview", { open: p !== null, onClose: () => (B.preview = null), title: "Preview Categories", size: "xl", testId: "category-import-preview-modal", children: modalBody })}`;
}

Boot.start("catalogues", (client, el) => {
  api = client;
  locationId = Boot.locationId;
  K.app(el, renderList);
  load();
});
</script>
</body>
</html>
