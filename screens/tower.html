<!doctype html>
<!--
  DISCOVERY SCREEN — Assistant — "The same chat, as the Control Tower's panel"
  Standalone-openable; also reached from the wiring hub (../index.html).
  Decision 2 (5 Oct 2026): the Control Tower's assistant is this same chat in a panel. The board behind
  it is the Vasu Foods Control Tower as published from foodbridge-mock-platform v7 (?vasu= for another
  copy); its own, older Assistant still shows inside the board -- this panel is the one under study.
  In the panel the chat answers about the business (tower-brain.js, from seed-data/tower-snapshot.json,
  Production included) and also offers "Set up a new store", which runs the same onboarding.
  Outgoing transitions: a lever's Open → that lever on the board behind (the frame); see the hub.
  HTML/CSS/vanilla JS only. Disposable. Informs the SSOTs, not imported by development/.
-->
<html lang="en" class="as-panel" data-mode="tower">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="favicon.ico" />
  <title>Control Tower — with the FoodBridge Assistant</title>
  <link rel="stylesheet" href="chat/shell.css?v=30d89ee" />
  <link rel="stylesheet" href="chat/widgets.css?v=30d89ee" />
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; background: #f4f5f7; }
    .bar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #fff; border-bottom: 1px solid #e3e6ea; font-size: 13px; }
    .bar a { color: #00664F; font-weight: 600; text-decoration: none; }
    .bar span { color: #667781; }
    #tower-frame { flex: 1; width: 100%; border: 0; background: #fff; }
    #as-open { position: fixed; right: 22px; bottom: 22px; z-index: 70; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border: 0; border-radius: 99px;
      background: #008069; color: #fff; font: 600 15px/1 inherit; box-shadow: 0 10px 28px rgba(11, 20, 26, .3); cursor: pointer; }
    #as-open i { width: 40px; height: 40px; border-radius: 50%; background: #FFE8D2 url(chat/mascot/hello-128.png) no-repeat 33% 0 / 155%; }
    html.cb-open #as-open { display: none; }
  </style>
</head>
<body>
  <div class="bar"><a href="../index.html">← Wiring hub</a><span>Vasu Foods Control Tower (demo, from mock-platform v7) — the green button is the new assistant</span></div>
  <iframe id="tower-frame" title="Control Tower — Vasu Foods"></iframe>
  <button type="button" id="as-open" aria-label="Open the FoodBridge Assistant"><i aria-hidden="true"></i>Assistant</button>
  <script>
    (function () {
      var v = (new URLSearchParams(location.search).get("vasu") || "https://nishant-devekar.github.io/foodbridge-mock-platform/v7/").replace(/\/?$/, "/");
      document.getElementById("tower-frame").src = v + "screens/control-tower.html";
    })();
  </script>
  <script src="store/catalogue.js?v=30d89ee"></script>
  <script src="store/model.js?v=30d89ee"></script>
  <script src="store/export.js?v=30d89ee"></script>
  <script src="store/import.js?v=30d89ee"></script>
  <script src="store/outbox.js?v=30d89ee"></script>
  <script src="chat/tower-brain.js?v=30d89ee"></script>
  <script src="chat/onboard.js?v=30d89ee"></script>
  <script src="feedback.js?v=30d89ee"></script>
  <script src="chat/app.js?v=30d89ee"></script>
  <script src="boot.js?v=30d89ee"></script>
</body>
</html>
