<!doctype html>
<!--
  DISCOVERY v5 SCREEN — Image Gallery (Addendum 006: baseline sync to Development).
  Ports, element for element: ImageDirectoryShell, useImageDirectoryController,
  ImageDirectoryToolbar, ImageDirectoryChipRow, ImageDirectoryCard, ImageDirectoryCardMenu,
  ImageBulkActionMenu, ImageDirectoryGridSkeleton, ByProductView, UploadImagesDrawer,
  ImageTagDrawer, ImageLinkProductDrawer, ManageProductImagesDrawer, CameraCaptureOverlay
  (+ ImageCropper, ImageGalleryBrowseView in ../assets/ui/camera.js).
  Mounted as the host mounts it (storefront-frontend pages/ImageDirectoryManagement.jsx):
  showHeading={false}, onNotify → host toasts. Data: sandbox seed (seed.catalogues — the
  sandbox's /images route shares the catalogue client).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery — Discovery v5</title>
<link rel="stylesheet" href="../assets/module.css">
<script src="../assets/pm-core.js"></script>
<script src="../assets/ui/icons.js"></script>
<script src="../assets/ui/kit.js"></script>
<script src="../assets/ui/camera.js"></script>
<script src="../assets/ui/boot.js"></script>
</head>
<body>
<script>
const SHOW_HEADING = false;
const PAGE_SIZE = 60;
const PRODUCTS_PAGE_SIZE = 40;
let api, locationId;
const onNotify = (m, t) => Boot.onNotify(m, t);
const idir = () => PM.imageDirectory;

// ---- useImageDirectoryController -----------------------------------------------------------
const G = {
  rawImages: [], imageErrors: new Set(), total: 0, page: 1, isLoading: true, isLoadingMore: false, error: null,
  view: "all", selectedTag: null, search: "", selected: new Set(),
  // shell
  cardMenu: null, activeDrawer: null, uploadOpen: false, cameraOpen: false, pendingDeleteKeys: null, mobileAddOpen: false,
  products: null, productsPage: 1, productsTotal: 0, isLoadingMoreProducts: false, categoryTree: null, productsRequested: false,
  manageState: null, addImagesAnchor: null, bulkOpenAnchor: null, mobileBulkOpen: false,
};
let seqNo = 0;
async function loadImages() {
  const seq = ++seqNo;
  G.isLoading = true;
  G.page = 1;
  K.update();
  try {
    const r = await api.listImageDirectory(locationId, 1, PAGE_SIZE);
    if (seq !== seqNo) return;
    G.rawImages = r.images;
    G.total = r.total;
    G.isLoading = false;
    G.error = null;
  } catch (err) {
    if (seq !== seqNo) return;
    G.isLoading = false;
    G.error = err;
  }
  K.update();
}
const refresh = () => loadImages();
const images = () => G.rawImages.filter((i) => !G.imageErrors.has(i.key));
const markImageError = (key) => {
  if (!G.imageErrors.has(key)) G.imageErrors = new Set([...G.imageErrors, key]);
};
function setView(v) {
  G.view = v;
  G.selectedTag = idir().ALL_TAGS;
  G.selected = new Set();
}
async function uploadMany(inputs) {
  const r = await api.bulkUploadImageDirectoryImages(locationId, inputs);
  refresh();
  return r;
}
async function updateTags(key, tags) {
  await api.updateImageDirectoryTags(locationId, key, tags);
  refresh();
}
async function bulkAddTags(keys, tags) {
  const r = await api.bulkUpdateImageDirectoryTags(locationId, keys, tags);
  refresh();
  G.selected = new Set();
  return r;
}
async function deleteImages(keys) {
  const r = await api.deleteImageDirectoryImages(locationId, keys);
  refresh();
  G.selected = new Set();
  return r;
}
async function linkToProduct(key, productId, slot) {
  const r = await api.mapImageDirectoryImageToProduct(locationId, key, productId, slot);
  refresh();
  return r;
}

// ---- ImageDirectoryShell -------------------------------------------------------------------
function ensureProducts() {
  // useEffect([view, activeDrawer, products]): fetch once when By-product or Link opens.
  if (G.view !== "by-product" && G.activeDrawer?.type !== "link") return;
  if (G.products !== null || G.productsRequested) return;
  G.productsRequested = true;
  api.listProducts(locationId, { page: 1, limit: PRODUCTS_PAGE_SIZE, catalogueType: "DEFAULT" })
    .then((res) => ((G.products = res.products), (G.productsTotal = res.totalDoc), (G.productsPage = 1), (G.productsRequested = false), K.update()))
    .catch((err) => ((G.productsRequested = false), onNotify(err.message, "error")));
  api.listCategories(locationId).then((t) => ((G.categoryTree = t), K.update())).catch(() => {});
}
function categoryNameById() {
  const m = new Map();
  for (const root of G.categoryTree ?? []) {
    m.set(root.id, root.name);
    for (const c of root.children) m.set(c.id, c.name);
  }
  return m;
}
function nextOpenSlotByProductId() {
  const m = new Map();
  for (const p of G.products ?? []) {
    const filled = p.imagesReference?.length ?? 0;
    if (filled < 4) m.set(p.id, filled);
  }
  return m;
}
async function loadMoreProducts() {
  if (G.isLoadingMoreProducts || !((G.products?.length ?? 0) < G.productsTotal)) return;
  G.isLoadingMoreProducts = true;
  K.update();
  try {
    const next = G.productsPage + 1;
    const res = await api.listProducts(locationId, { page: next, limit: PRODUCTS_PAGE_SIZE, catalogueType: "DEFAULT" });
    G.products = [...(G.products ?? []), ...res.products];
    G.productsTotal = res.totalDoc;
    G.productsPage = next;
  } catch (err) {
    onNotify(err instanceof Error ? err.message : "Failed to load more products.", "error");
  } finally {
    G.isLoadingMoreProducts = false;
    K.update();
  }
}
async function openManage(productId) {
  const product = (G.products ?? []).find((p) => p.id === productId);
  if (!product) return;
  const { images: current } = await api.getProductImages(productId);
  G.manageState = { product, currentImages: current };
  G.activeDrawer = { type: "manage", productId };
  K.update();
}
function closeManage() {
  G.activeDrawer = null;
  G.manageState = null;
  K.drop("manage");
}
async function handleUploadMany(inputs) {
  const results = await uploadMany(inputs);
  const failed = results.filter((r) => r.status === "failed");
  if (failed.length === results.length) onNotify(`${failed.length} image${failed.length === 1 ? "" : "s"} failed to upload.`, "error");
  else if (failed.length > 0) onNotify(`${results.length - failed.length} of ${results.length} images uploaded, ${failed.length} failed.`, "error");
  else onNotify(results.length === 1 ? "Image uploaded." : `${results.length} images uploaded.`, "success");
  return results;
}
async function handleBulkDeleteConfirm() {
  if (!G.pendingDeleteKeys) return;
  const keys = G.pendingDeleteKeys;
  const results = await deleteImages(keys);
  const failed = results.filter((r) => r.status === "failed");
  if (failed.length > 0) onNotify(`${failed.length} image${failed.length === 1 ? "" : "s"} could not be deleted.`, "error");
  else onNotify(keys.length === 1 ? "Image deleted." : "Images deleted.", "success");
  G.pendingDeleteKeys = null;
}
const openTag = (keys) => ((G.activeDrawer = { type: "tag", initialSelectedKeys: keys }), K.drop("tag"));

K.on["g.search"] = (_, ev) => (G.search = ev.target.value);
K.on["g.addImages"] = (_, ev, el) => (G.addImagesAnchor = G.addImagesAnchor ? null : el.getBoundingClientRect());
K.on["g.openUpload"] = () => ((G.addImagesAnchor = null), (G.uploadOpen = true));
K.on["g.openCamera"] = () => ((G.addImagesAnchor = null), (G.cameraOpen = true));
K.on["g.byProduct"] = () => setView(G.view === "by-product" ? "all" : "by-product");
K.on["g.quickTag"] = () => openTag([]);
K.on["g.bulkToggle"] = (_, ev, el) => (G.bulkOpenAnchor = G.bulkOpenAnchor ? null : el.getBoundingClientRect());
K.on["g.bulkTag"] = () => ((G.bulkOpenAnchor = null), openTag(Array.from(G.selected)));
K.on["g.bulkDelete"] = () => ((G.bulkOpenAnchor = null), (G.pendingDeleteKeys = Array.from(G.selected)));
K.on["g.filterAll"] = () => setView("all");
K.on["g.filterUnlinked"] = () => setView("unlinked");
K.on["g.filterTag"] = (key) => ((G.selectedTag = key), (G.selected = new Set()));
K.on["g.toggle"] = (key) => {
  const n = new Set(G.selected);
  n.has(key) ? n.delete(key) : n.add(key);
  G.selected = n;
};
K.on["g.cardMenu"] = (key, ev, el) => {
  const image = images().find((i) => i.key === key);
  G.cardMenu = { image, anchor: el.getBoundingClientRect(), key };
};
K.on["g.menuLink"] = () => {
  if (G.cardMenu) {
    G.activeDrawer = { type: "link", image: G.cardMenu.image };
    K.drop("link");
  }
  G.cardMenu = null;
};
K.on["g.menuTag"] = () => {
  if (G.cardMenu) openTag([G.cardMenu.image.key]);
  G.cardMenu = null;
};
K.on["g.menuDelete"] = () => {
  if (G.cardMenu) G.pendingDeleteKeys = [G.cardMenu.image.key];
  G.cardMenu = null;
};
K.on["g.imgError"] = (key) => markImageError(key);
K.on["g.loadMore"] = () => {
  G.isLoadingMore = true;
  const next = G.page + 1;
  api.listImageDirectory(locationId, next, PAGE_SIZE)
    .then((r) => ((G.rawImages = [...G.rawImages, ...r.images]), (G.total = r.total), (G.page = next), (G.isLoadingMore = false), K.update()))
    .catch((err) => ((G.isLoadingMore = false), (G.error = err), K.update()));
};
K.on["g.back"] = () => setView("all");
K.on["g.manage"] = (id) => openManage(id);
K.on["g.moreProducts"] = () => loadMoreProducts();
K.on["g.mobileAdd"] = () => (G.mobileAddOpen = true);
K.on["g.mobileAddClose"] = () => (G.mobileAddOpen = false);
K.on["g.mobileUpload"] = () => ((G.mobileAddOpen = false), (G.uploadOpen = true));
K.on["g.mobileCamera"] = () => ((G.mobileAddOpen = false), (G.cameraOpen = true));
K.on["g.mobileTag"] = () => openTag(Array.from(G.selected));
K.on["g.mobileBulk"] = () => (G.mobileBulkOpen = !G.mobileBulkOpen);
K.on["g.mobileBulkClose"] = () => (G.mobileBulkOpen = false);
K.on["g.mobileBulkTag"] = () => ((G.mobileBulkOpen = false), openTag(Array.from(G.selected)));
K.on["g.mobileBulkDelete"] = () => ((G.mobileBulkOpen = false), (G.pendingDeleteKeys = Array.from(G.selected)));

function card(image) {
  const id = image.key;
  const e = K.esc(id);
  const tags = idir().visibleTags(image);
  const sel = G.selected.has(id);
  const tt = `image-directory-card-tags-${e}`;
  return `<article data-key="${e}" data-testid="image-directory-card-${e}" class="group relative overflow-hidden rounded-lg border bg-white transition-shadow dark:bg-gray-800 ${sel ? "border-green-500 ring-2 ring-green-500" : "border-gray-200 dark:border-gray-700"}">
    <div class="relative aspect-square bg-gray-100 dark:bg-gray-700">
      <img src="${K.esc(image.url)}" alt="" class="h-full w-full object-cover" data-on-error="g.imgError|${e}">
      <label class="absolute left-2 top-2 flex h-6 w-6 items-center justify-center rounded-md bg-white/90 shadow-sm dark:bg-gray-900/80"><input type="checkbox"${K.attr("checked", sel)} data-on-change="g.toggle|${e}" data-testid="image-directory-card-select-${e}" class="h-4 w-4 accent-green-600"></label>
      <button type="button" data-card-kebab="${e}" data-on-click="g.cardMenu|${e}" data-testid="image-directory-card-actions-${e}" aria-label="Image actions" class="absolute right-2 top-2 flex h-7 w-7 items-center justify-center rounded-md bg-white/90 text-gray-600 shadow-sm hover:bg-white dark:bg-gray-900/80 dark:text-gray-300">${K.icon("FiMoreVertical")}</button>
    </div>
    <div class="flex flex-wrap items-center gap-1 p-2">${tags.length === 0
      ? `<span class="text-xs text-gray-400 dark:text-gray-500" data-testid="${tt}-empty">No tags</span>`
      : `${tags.slice(0, 1).map((t) => `<span data-testid="${tt}-tag-${K.esc(t)}" class="rounded-full bg-green-50 px-2 py-0.5 text-xs text-green-700 dark:bg-green-900/30 dark:text-green-400">${K.esc(t)}</span>`).join("")}${tags.length > 1 ? `<span class="text-xs text-gray-400 dark:text-gray-500">+${tags.length - 1} more</span>` : ""}`}</div>
  </article>`;
}

function toolbar() {
  const bp = G.view === "by-product";
  const count = G.selected.size;
  return `<div class="flex flex-col gap-3 rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-gray-800 sm:flex-row sm:flex-wrap sm:items-center">
    <div class="min-w-[220px] flex-1" style="position:relative">${K.icon("FiSearch", "pointer-events-none text-gray-400").replace("<svg", '<svg style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem"')}
      <input type="search" value="${K.esc(G.search)}" data-on-input="g.search" placeholder="Search by name, category or tag" data-testid="image-directory-toolbar-search-input" class="h-10 w-full rounded-md border border-gray-300 bg-white pl-9 pr-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-green-500 focus:outline-none focus:ring-1 focus:ring-green-500 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100"></div>
    <div class="relative">
      <button type="button" data-on-click="g.addImages" data-testid="image-directory-add-images-btn" class="flex h-10 items-center gap-2 rounded-md bg-green-600 px-4 text-sm font-medium text-white hover:bg-green-700">${K.icon("FiPlus")}Add images${K.icon("FiChevronDown", "text-xs")}</button>
      ${DropdownMenu("add-images-menu", { anchor: G.addImagesAnchor, anchorSelector: '[data-testid="image-directory-add-images-btn"]', onClose: () => (G.addImagesAnchor = null), testId: "image-directory-add-images-menu",
        children: DropdownMenuItem({ action: "g.openUpload", icon: K.icon("FiUpload", "text-green-600"), testId: "image-directory-add-menu-upload-btn", label: "Upload images" }) + DropdownMenuItem({ action: "g.openCamera", icon: K.icon("FiCamera", "text-green-600"), testId: "image-directory-add-menu-capture-btn", label: "Take photos" }) })}
    </div>
    <button type="button" data-on-click="g.byProduct" data-testid="image-directory-view-by-product-btn" data-status="${bp ? "active" : "inactive"}" aria-pressed="${bp}" class="inline-flex h-[42px] shrink-0 items-center justify-center gap-2 rounded-xl border px-4 text-sm font-semibold shadow-sm transition focus:outline-none focus:ring-2 focus:ring-green-500/30 ${bp ? "border-green-600 bg-green-600 text-white hover:bg-green-700" : "border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200"}">${K.icon("PackageOpen", "h-4 w-4")}Upload images to products</button>
    <div class="relative">
      <button type="button" data-on-click="g.bulkToggle" data-testid="image-bulk-action-trigger-btn" data-status="${G.bulkOpenAnchor ? "open" : "closed"}" class="flex h-10 items-center gap-2 rounded-md border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200">Bulk actions${count > 0 ? `<span data-testid="image-bulk-action-count-badge" class="rounded-full bg-gray-200 px-1.5 py-0.5 text-xs text-gray-700 dark:bg-gray-700 dark:text-gray-200">${count}</span>` : ""}${K.icon("FiChevronDown", "text-xs")}</button>
      ${DropdownMenu("bulk-menu", { anchor: G.bulkOpenAnchor, anchorSelector: '[data-testid="image-bulk-action-trigger-btn"]', onClose: () => (G.bulkOpenAnchor = null), testId: "image-bulk-action-menu",
        children: count === 0 ? `<p data-testid="image-bulk-action-empty-hint" class="px-3 py-2 text-xs text-gray-400">Select images first.</p>` : DropdownMenuItem({ action: "g.bulkTag", icon: K.icon("FiTag", "text-green-600"), testId: "image-bulk-action-tag-btn", label: "Add tags" }) + DropdownMenuItem({ action: "g.bulkDelete", icon: K.icon("FiTrash2"), danger: true, testId: "image-bulk-action-delete-btn", label: "Delete" }) })}
    </div>
    <button type="button" data-on-click="g.quickTag" data-testid="image-directory-toolbar-add-tag-btn" class="flex h-10 items-center gap-2 rounded-md border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200">${K.icon("FiTag", "text-green-600")}Add tag</button>
  </div>`;
}

function chipRow(availableTags) {
  if (G.view === "by-product") return "";
  const chip = (active) => `shrink-0 rounded-full px-3 py-1 text-sm font-medium transition-colors ${active ? "bg-green-600 text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"}`;
  const all = idir().ALL_TAGS;
  return `<div class="flex gap-2 overflow-x-auto pb-1 pt-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden sm:flex-wrap sm:overflow-visible sm:pb-0" aria-label="Filter images">
    <button type="button" data-on-click="g.filterAll" data-testid="image-directory-filter-all" class="${chip(G.view === "all" && G.selectedTag === all)}">All</button>
    <button type="button" data-on-click="g.filterUnlinked" data-testid="image-directory-filter-unlinked" class="${chip(G.view === "unlinked")}">Unlinked</button>
    ${availableTags.map((t) => {
      const on = G.view === "all" && G.selectedTag === t.key;
      return `<button data-key="${K.esc(t.key)}" type="button" data-on-click="g.filterTag|${K.esc(t.key)}" data-testid="image-directory-filter-tag-${K.esc(t.key)}" class="inline-flex items-center gap-1.5 ${chip(on)}"><span>${K.esc(t.label)}</span><span data-testid="image-directory-filter-tag-${K.esc(t.key)}-count" class="${on ? "text-white/75" : "text-gray-400"}">${t.count}</span></button>`;
    }).join("")}
  </div>`;
}

function byProductView(filtered) {
  const cats = categoryNameById();
  const { withPhotos, withoutPhotos } = idir().groupImagesByProduct(filtered, G.products ?? [], cats, G.search);
  const hasMore = (G.products?.length ?? 0) < G.productsTotal;
  return `<div data-testid="image-directory-by-product-view">
    <button type="button" data-on-click="g.back" data-testid="image-directory-back-to-all-btn" class="mb-4 flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">${K.icon("FiArrowLeft")}Back to all images</button>
    ${withoutPhotos.length > 0 ? `<div class="mb-6"><p class="mb-2 text-sm font-semibold text-gray-700 dark:text-gray-200">Missing a photo (${withoutPhotos.length})</p><div class="divide-y divide-gray-100 rounded-lg border border-gray-200 dark:divide-gray-700 dark:border-gray-700">${withoutPhotos.map((p) => `<button data-key="${p.id}" type="button" data-on-click="g.manage|${p.id}" data-testid="image-directory-missing-photo-${p.id}" class="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-800">
      <span class="flex h-9 w-9 items-center justify-center rounded-md bg-gray-100 text-gray-400 dark:bg-gray-700">${K.icon("FiImage")}</span>
      <span class="flex-1"><span class="block text-sm font-medium text-gray-800 dark:text-gray-100" data-testid="image-directory-missing-photo-name-${p.id}">${K.esc(p.name)}</span><span class="block text-xs text-gray-400">${K.esc((p.categoryReference ? cats.get(p.categoryReference) : undefined) ?? "")}</span></span>
      <span class="text-sm font-medium text-green-600">Add photo</span></button>`).join("")}</div></div>` : ""}
    <div>${withPhotos.map(({ product, images: imgs }) => `<div data-key="${product.id}" class="mb-6" data-testid="image-directory-product-group-${product.id}">
      <div class="mb-2 flex items-center justify-between"><div><p class="text-sm font-semibold text-gray-800 dark:text-gray-100" data-testid="image-directory-product-group-name-${product.id}">${K.esc(product.name)}</p><p class="text-xs text-gray-400">${imgs.length} image${imgs.length === 1 ? "" : "s"}</p></div>
        <button type="button" data-on-click="g.manage|${product.id}" data-testid="image-directory-manage-images-${product.id}" class="rounded-md border border-gray-300 px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">Manage</button></div>
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-4 md:grid-cols-6">${imgs.map(card).join("")}</div></div>`).join("")}</div>
    ${withPhotos.length === 0 && withoutPhotos.length === 0 ? `<p class="py-12 text-center text-sm text-gray-400" data-testid="image-directory-by-product-empty">No products to show.</p>` : ""}
    ${hasMore ? `<div class="flex justify-center pt-2"><button type="button" data-on-click="g.moreProducts"${K.attr("disabled", G.isLoadingMoreProducts)} data-testid="image-directory-by-product-load-more-btn" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">${G.isLoadingMoreProducts ? "Loading…" : "Show more products"}</button></div>` : ""}
  </div>`;
}

function render() {
  if (G.error) return `<p role="alert" data-testid="image-directory-list-error">Something went wrong: ${K.esc(G.error.message)}</p>`;
  ensureProducts();
  const all = images();
  const filtered = idir().filterImageDirectoryImages(all, { view: G.view, selectedTag: G.selectedTag, search: G.search });
  const availableTags = idir().distinctTags(all);
  const hasMore = G.rawImages.length < G.total;
  let main;
  if (G.view === "by-product") main = byProductView(filtered);
  else if (G.isLoading) main = `<div class="grid grid-cols-2 gap-3 sm:grid-cols-4 md:grid-cols-6" role="status" aria-label="Loading image directory" data-testid="image-directory-loading">${Array.from({ length: 12 }, () => `<div class="overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"><div class="aspect-square animate-pulse bg-gray-200 dark:bg-gray-700"></div><div class="p-2"><div class="h-4 w-12 animate-pulse rounded-full bg-gray-200 dark:bg-gray-700"></div></div></div>`).join("")}</div>`;
  else if (filtered.length === 0) main = `<p data-testid="image-directory-empty" class="px-4 py-6 text-center text-gray-500 dark:text-gray-400">Nothing in this view.</p>`;
  else main = `<div class="grid grid-cols-2 gap-3 sm:grid-cols-4 md:grid-cols-6" data-testid="image-directory-grid">${filtered.map(card).join("")}</div>
    ${hasMore ? `<div class="flex justify-center pt-2"><button type="button" data-on-click="g.loadMore"${K.attr("disabled", G.isLoadingMore)} data-testid="image-directory-load-more-btn" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200">${G.isLoadingMore ? "Loading…" : "Show more images"}</button></div>` : ""}`;

  const bp = G.view === "by-product";
  const count = G.selected.size;

  const term = s.search.trim().toLowerCase();
  const filtered = !term ? linkable : linkable.filter((p) => p.name.toLowerCase().includes(term) || p.articleNumber.toLowerCase().includes(term));
  const visible = filtered.slice(0, s.visibleCount);
  const catMap = Object.fromEntries(cats);
  return SlideDrawer("link-drawer", {
    open: true, onClose: linkClose, title: "Link product", description: "Select every product this image should be added to.", testId: "image-directory-link-products-drawer",
    footer: `<div class="flex w-full flex-col gap-3"><span data-testid="image-directory-link-products-drawer-selection-label" class="text-sm text-gray-500 dark:text-gray-400">${s.selected.size} product${s.selected.size === 1 ? "" : "s"} selected</span>
      <div class="grid gap-3 sm:grid-cols-2"><button type="button" data-on-click="lk.close" data-testid="image-directory-link-products-drawer-cancel-btn" class="h-12 w-full rounded-lg border border-red-200 bg-white px-5 text-sm font-semibold text-red-500 transition hover:border-red-300 hover:bg-red-50 dark:border-red-900 dark:bg-transparent">Cancel</button>
      <button type="button" data-on-click="lk.save"${K.attr("disabled", s.selected.size === 0 || s.isSubmitting)} data-testid="image-directory-link-products-drawer-save-btn" class="h-12 w-full rounded-lg bg-green-600 px-5 text-sm font-semibold text-white transition hover:bg-green-700 disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-500">${s.isSubmitting ? "Saving…" : "Save"}</button></div></div>`,
    children: `<div class="space-y-4">
      <div class="aspect-video w-full max-w-xs overflow-hidden rounded-md border border-gray-200 dark:border-gray-700"><img src="${K.esc(G.activeDrawer.image.url)}" alt="" class="h-full w-full object-cover"></div>
      <input type="search" value="${K.esc(s.search)}" data-on-input="lk.search" placeholder="Search products" data-testid="image-directory-link-products-drawer-search-input" class="h-10 w-full rounded-md border border-gray-300 px-3 text-sm focus:border-green-500 focus:outline-none focus:ring-1 focus:ring-green-500 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100">
      ${filtered.length === 0 ? `<p class="py-6 text-center text-sm text-gray-400" data-testid="image-directory-link-products-drawer-empty">No products with an open image slot match "${K.esc(s.search)}".</p>` : `<div class="grid grid-cols-2 gap-2.5 sm:grid-cols-3 lg:grid-cols-4">${visible.map((product) => {
        const on = s.selected.has(product.id);
        const vm = PM.mapProduct.mapProductToListItem(product, false, catMap, {});
        return `<button data-key="${product.id}" type="button" data-on-click="lk.toggle|${product.id}" aria-pressed="${on}" data-testid="image-directory-link-product-card-${product.id}" data-status="${on ? "selected" : "unselected"}" class="group block w-full min-w-0 max-w-full overflow-hidden rounded-xl border bg-white text-left transition dark:bg-gray-900 ${on ? "border-green-500 ring-2 ring-green-500/20" : "border-gray-200 hover:border-gray-300 hover:shadow-sm dark:border-gray-700"}">
          <span class="relative block aspect-[4/3] w-full overflow-hidden bg-gray-100 dark:bg-gray-800">${ProductImage({ productId: product.id, directUrl: vm.thumbnailUrl, alt: "", className: "h-full w-full object-cover" })}
            <span class="absolute right-2 top-2 flex h-7 w-7 items-center justify-center rounded-lg border-2 shadow-md ${on ? "border-white bg-green-600 text-white" : "border-white bg-white/95 text-transparent"}">${on ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M20 6 9 17l-5-5"></path></svg>` : ""}</span></span>
          <span class="block min-w-0 p-3"><span data-testid="image-directory-link-product-card-${product.id}-name" class="block truncate text-sm font-semibold text-gray-800 dark:text-gray-100" title="${K.esc(vm.displayName)}">${K.esc(vm.displayName)}</span>
            <span class="mt-0.5 flex items-center gap-1 truncate text-[11px] text-gray-500 dark:text-gray-400">${K.icon("FiPackage", "h-3 w-3 shrink-0")}${K.esc(vm.articleNumberLabel)} · ${K.esc(vm.categoryLabel ?? "Uncategorised")}</span>
            <span class="mt-2 flex min-w-0 items-center justify-between gap-2 rounded-lg bg-gray-50 px-2 py-1.5 dark:bg-gray-800"><span data-testid="image-directory-link-product-card-${product.id}-price" class="shrink-0 text-xs font-bold text-gray-800 dark:text-gray-100">${vm.price !== undefined ? K.esc(PM.format.formatPrice(vm.price)) : "—"}</span><span data-testid="image-directory-link-product-card-${product.id}-stock" class="min-w-0 truncate text-[11px] font-medium text-gray-500 dark:text-gray-400">${K.esc(vm.stockLabel ?? 0)} ${K.esc(vm.stockUnitLabel ?? "")}</span></span></span>
        </button>`;
      }).join("")}</div>
      ${s.visibleCount < filtered.length ? `<button type="button" data-on-click="lk.more" data-testid="image-directory-link-products-drawer-show-more-btn" class="w-full rounded-xl border border-dashed border-gray-300 py-3 text-sm font-semibold text-green-700 hover:bg-green-50 dark:border-gray-600 dark:text-green-400 dark:hover:bg-gray-800">Show more (${filtered.length - s.visibleCount} remaining)</button>` : ""}`}
    </div>`,
  });
}

// ---- ManageProductImagesDrawer -------------------------------------------------------------
const initialPending = (cur) => [...cur].sort((a, b) => a.slot - b.slot).map((i) => ({ id: i.sourceGalleryKey ?? i.url, url: i.url, key: i.sourceGalleryKey, originSlot: i.slot }));
function manageState() {
  return K.state("manage", () => ({ search: "", selectedTag: "", pending: initialPending(G.manageState.currentImages), isSaving: false }));
}
const isPinned = (e) => e.originSlot !== undefined && !e.key;
function canMove(pending, i, d) {
  const t = i + d;
  if (t < 0 || t >= pending.length) return false;
  return !(isPinned(pending[i]) || isPinned(pending[t]));
}
function manageClose() {
  closeManage();
}
K.on["mg.search"] = (_, ev) => (manageState().search = ev.target.value);
K.on["mg.tag"] = (k) => (manageState().selectedTag = k);
K.on["mg.remove"] = (i) => (manageState().pending = manageState().pending.filter((_, idx) => idx !== Number(i)));
K.on["mg.move"] = (arg) => {
  const [i, d] = arg.split("|").map(Number);
  const s = manageState();
  if (!canMove(s.pending, i, d)) return;
  const next = [...s.pending];
  [next[i], next[i + d]] = [next[i + d], next[i]];
  s.pending = next;
};
K.on["mg.toggle"] = (key) => {
  const s = manageState();
  const image = images().find((im) => im.key === key);
  if (s.pending.some((e) => e.id === key)) s.pending = s.pending.filter((e) => e.id !== key);
  else if (s.pending.length < 4) s.pending = [...s.pending, { id: image.key, url: image.url, key: image.key }];
};
K.on["mg.close"] = () => manageClose();
K.on["mg.save"] = async () => {
  const s = manageState();
  s.isSaving = true;
  K.update();
  const productId = G.manageState.product.id;
  const original = initialPending(G.manageState.currentImages);
  const refreshCurrent = async () => {
    const { images: cur } = await api.getProductImages(productId);
    G.manageState = { ...G.manageState, currentImages: cur };
    G.products = null;
  };
  try {
    for (let slot = 0; slot < 4; slot++) {
      const f = s.pending[slot];
      const o = original[slot];
      if (!f && o) {
        await api.removeProductImage(productId, slot);
        await refreshCurrent();
      } else if (f && f.id !== o?.id && f.key) {
        await linkToProduct(f.key, productId, slot);
        await refreshCurrent();
      }
    }
    onNotify("Product images updated.", "success");
    manageClose();
  } finally {
    s.isSaving = false;
    K.update();
  }
};
function ManageProductImagesDrawer(pool) {
  const s = manageState();
  const product = G.manageState.product;
  const cats = categoryNameById();
  const categoryName = product.categoryReference ? cats.get(product.categoryReference) : undefined;
  const original = initialPending(G.manageState.currentImages);
  const pendingKeys = new Set(s.pending.map((e) => e.id));
  const dirty = s.pending.length !== original.length || s.pending.some((e, i) => e.id !== original[i]?.id);
  const vt = idir().visibleTags;
  const counts = new Map();
  for (const im of pool)
    for (const raw of vt(im)) {
      const label = raw.trim();
      const key = label.toLowerCase();
      if (!key) continue;
      const e = counts.get(key);
      e ? e.count++ : counts.set(key, { label, count: 1 });
    }
  const tagFilters = Array.from(counts.entries()).map(([key, v]) => ({ key, ...v })).sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
  const term = s.search.trim().toLowerCase();
  const filteredPool = pool.filter((im) => {
    if (s.selectedTag && !vt(im).some((t) => t.trim().toLowerCase() === s.selectedTag)) return false;
    if (!term) return true;
    return `${idir().fileNameFromKey(im.key)} ${vt(im).join(" ")}`.toLowerCase().includes(term);
  });
  const chip = (active) => `inline-flex shrink-0 items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors ${active ? "bg-green-600 text-white" : "bg-gray-100 text-gray-600 hover:bg-green-50 hover:text-green-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-green-900/30 dark:hover:text-green-400"}`;
  const check = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M20 6 9 17l-5-5"></path></svg>`;
  return SlideDrawer("manage-drawer", {
    open: true, onClose: manageClose, width: "medium", title: "Manage product images", testId: "product-image-link-drawer",
    description: `<p class="truncate text-sm font-semibold text-gray-700 dark:text-gray-200">${K.esc(product.name)}</p><p data-testid="product-image-link-drawer-article" class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">${K.esc(product.articleNumber)} · ${K.esc(categoryName ?? "Uncategorized")}</p>`,
    icon: `<span data-testid="product-image-link-drawer-icon" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400">${K.icon("Images", "h-5 w-5")}</span>`,
    footer: `<div class="flex w-full flex-col gap-3"><div class="flex items-center justify-between text-sm"><span data-testid="product-image-link-drawer-linked-count" class="font-medium text-gray-500 dark:text-gray-400">${s.pending.length} image${s.pending.length === 1 ? "" : "s"} linked</span>${dirty ? `<span data-testid="product-image-link-drawer-unsaved-indicator" class="text-xs font-semibold text-amber-600">Unsaved changes</span>` : ""}</div>
      <div class="grid gap-3 sm:grid-cols-2"><button type="button" data-on-click="mg.close" data-testid="product-image-link-drawer-cancel-btn" class="h-12 w-full rounded-lg border border-red-200 bg-white px-5 text-sm font-semibold text-red-500 transition hover:border-red-300 hover:bg-red-50 dark:border-red-900 dark:bg-transparent">Cancel</button>
      <button type="button" data-on-click="mg.save"${K.attr("disabled", !dirty || s.isSaving)} data-testid="product-image-link-drawer-save-btn" class="h-12 w-full rounded-lg bg-green-600 px-5 text-sm font-semibold text-white transition hover:bg-green-700 disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-500">${s.isSaving ? "Saving…" : "Save images"}</button></div></div>`,
    children: `<div class="-m-6 flex h-full flex-col">
      <div class="shrink-0 border-b border-gray-100 bg-gray-50/70 px-6 py-4 dark:border-gray-700 dark:bg-gray-800">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2"><div><h3 class="text-sm font-bold text-gray-800 dark:text-gray-100">Image order</h3><p class="text-xs text-gray-500 dark:text-gray-400">The first image is the primary product image. Maximum 4.</p></div><span data-testid="product-image-link-drawer-order-count" class="rounded-full bg-white px-3 py-1 text-xs font-semibold text-gray-600 shadow-sm dark:bg-gray-900 dark:text-gray-300">${s.pending.length}/4</span></div>
        ${s.pending.length === 0 ? `<div data-testid="product-image-link-drawer-order-empty" class="flex items-center gap-2 rounded-lg border border-dashed border-gray-300 px-4 py-3 text-gray-400 dark:border-gray-600">${K.icon("FiImage", "h-5 w-5 shrink-0")}<p class="text-sm">No image linked. Select images from the gallery below.</p></div>`
          : `<div class="flex gap-2 overflow-x-auto pb-1">${s.pending.map((e, i) => `<article data-key="${K.esc(e.id)}" data-testid="product-image-link-drawer-ordered-${i}" class="w-28 shrink-0 overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-900">
            <div class="relative h-20 bg-gray-100 dark:bg-gray-800"><img src="${K.esc(e.url)}" alt="" class="h-full w-full object-cover"${e.key ? ` data-on-error="g.imgError|${K.esc(e.key)}"` : ""}><span class="absolute left-1.5 top-1.5 rounded-full bg-black/65 px-1.5 py-0.5 text-[9px] font-bold text-white">${i === 0 ? "Primary" : `Image ${i + 1}`}</span>${e.originSlot === undefined ? `<span class="absolute bottom-1.5 left-1.5 rounded-full bg-green-600 px-1.5 py-0.5 text-[9px] font-bold text-white">New</span>` : ""}
              <button type="button" data-on-click="mg.remove|${i}" data-testid="product-image-link-drawer-ordered-remove-${i}" aria-label="Remove image ${i + 1}" class="absolute right-1.5 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-white/95 text-red-500 shadow hover:bg-red-50">${K.icon("FiTrash2", "h-3.5 w-3.5")}</button></div>
            <div class="flex items-center justify-between gap-1 p-1.5">
              <button type="button" data-on-click="mg.move|${i}|-1"${K.attr("disabled", !canMove(s.pending, i, -1))} data-testid="product-image-link-drawer-ordered-move-left-${i}" aria-label="Move image left" class="flex h-6 flex-1 items-center justify-center rounded border text-gray-500 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-30 dark:border-gray-700 dark:hover:bg-gray-800">${K.icon("FiArrowLeft", "h-3.5 w-3.5")}</button>
              <button type="button" data-on-click="mg.move|${i}|1"${K.attr("disabled", !canMove(s.pending, i, 1))} data-testid="product-image-link-drawer-ordered-move-right-${i}" aria-label="Move image right" class="flex h-6 flex-1 items-center justify-center rounded border text-gray-500 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-30 dark:border-gray-700 dark:hover:bg-gray-800">${K.icon("FiArrowRight", "h-3.5 w-3.5")}</button></div></article>`).join("")}</div>`}
      </div>
      <div class="shrink-0 border-b border-gray-100 p-6 dark:border-gray-700">
        <div class="mb-3"><h3 class="text-sm font-bold text-gray-800 dark:text-gray-100">Image gallery</h3><p class="text-xs text-gray-500 dark:text-gray-400">Select images to add them to the product.</p></div>
        <label class="flex items-center gap-2 rounded-xl border bg-gray-50 px-3 py-2.5 focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-500/20 dark:border-gray-700 dark:bg-gray-900">${K.icon("FiSearch", "h-4 w-4 text-gray-400")}<input value="${K.esc(s.search)}" data-on-input="mg.search" placeholder="Search by filename or tag…" data-testid="product-image-link-drawer-search-input" class="min-w-0 flex-1 bg-transparent text-sm text-gray-800 outline-none dark:text-gray-100"></label>
        ${tagFilters.length > 0 ? `<div class="mt-3 flex items-center gap-2 overflow-x-auto pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          <button type="button" data-on-click="mg.tag|" data-testid="product-image-link-drawer-tag-all" data-status="${s.selectedTag ? "unselected" : "selected"}" class="${chip(!s.selectedTag)}">All<span class="${s.selectedTag ? "text-gray-400 dark:text-gray-500" : "text-white/75"}">${pool.length}</span></button>
          ${tagFilters.map((t) => `<button type="button" data-on-click="mg.tag|${s.selectedTag === t.key ? "" : K.esc(t.key)}" data-testid="product-image-link-drawer-tag-${K.esc(t.key)}" data-status="${s.selectedTag === t.key ? "selected" : "unselected"}" class="${chip(s.selectedTag === t.key)}">${K.esc(t.label)}<span class="${s.selectedTag === t.key ? "text-white/75" : "text-gray-400 dark:text-gray-500"}">${t.count}</span></button>`).join("")}
        </div>` : ""}
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto p-6">
        ${filteredPool.length === 0 ? `<div data-testid="product-image-link-drawer-gallery-empty" class="py-14 text-center text-sm text-gray-400">No gallery images found.</div>` : ""}
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">${filteredPool.map((im) => {
          const on = pendingKeys.has(im.key);
          const dis = !on && s.pending.length >= 4;
          const tags = vt(im);
          return `<button data-key="${K.esc(im.key)}" type="button" data-on-click="mg.toggle|${K.esc(im.key)}"${K.attr("disabled", dis)} aria-pressed="${on}" aria-label="${on ? "Remove selected image" : "Select image"}" data-testid="product-image-link-drawer-gallery-${K.esc(im.key)}" class="group relative aspect-square overflow-hidden rounded-xl border text-left transition-colors disabled:cursor-not-allowed disabled:opacity-55 ${on ? "border-green-500 ring-2 ring-green-500/20" : "border-gray-200 hover:border-green-300 dark:border-gray-700"}">
            <img src="${K.esc(im.url)}" alt="" class="h-full w-full object-cover" data-on-error="g.imgError|${K.esc(im.key)}">
            ${on ? `<span class="absolute left-2 top-2 flex h-7 w-7 items-center justify-center rounded-lg border-2 border-white bg-green-600 text-white shadow-md">${check}</span>` : ""}
            ${tags.length ? `<span data-testid="product-image-link-drawer-gallery-${K.esc(im.key)}-tags" class="absolute inset-x-0 bottom-0 flex min-h-12 items-end gap-1 bg-gradient-to-t from-black/75 via-black/35 to-transparent p-2 pt-6">${tags.slice(0, 2).map((t) => `<span class="max-w-[45%] truncate rounded-full bg-white/90 px-2 py-0.5 text-[9px] font-semibold text-green-700">${K.esc(t)}</span>`).join("")}${tags.length > 2 ? `<span class="shrink-0 rounded-full bg-white/90 px-2 py-0.5 text-[9px] font-semibold text-gray-600">+${tags.length - 2}</span>` : ""}</span>` : ""}
          </button>`;
        }).join("")}</div>
      </div>
    </div>`,
  });
}

Boot.start("catalogues", (client, el) => {
  api = client;
  locationId = Boot.locationId;
  G.selectedTag = PM.imageDirectory.ALL_TAGS;
  K.app(el, render);
  loadImages();
});
</script>
</body>
</html>
