<!doctype html>
<!--
  DISCOVERY v5 SCREEN — Catalogue (Addendum 006: baseline sync to Development).
  Ports, element for element: CatalogueListShell, useCatalogueListController, CatalogueDrawer,
  useCatalogueDrawerController, CataloguePricingCsvActions, CatalogueSendCampaignModal,
  CatalogueTableSkeleton (+ shared DeleteModal, DiscardChangesModal, BulkActionDropdown,
  SlideDrawer, UnitPriceModal/UnitPriceForm, Pagination in ../assets/ui).
  Mounted as the host mounts it (storefront-frontend pages/CatalogueManagement.jsx):
  showHeading={false}, onNotify → host toasts. Data: sandbox seed (seed.catalogues).
  Open through a local static server (seed.json is fetched).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Discovery v5</title>
<link rel="stylesheet" href="../assets/module.css?v=6.4">
<script src="../assets/pm-core.js?v=6.4"></script>
<script src="../assets/ui/icons.js?v=6.4"></script>
<script src="../assets/ui/kit.js?v=6.4"></script>
<script src="../assets/ui/unit-price.js?v=6.4"></script>
<script src="../assets/ui/boot.js?v=6.4"></script>
</head>
<body>
<script>
const PAGE_SIZE = 20;
const SHOW_HEADING = false;
let api, locationId;
const onNotify = (m, t) => Boot.onNotify(m, t);

// ---- useCatalogueListController ----------------------------------------------------------
const L = {
  items: [], totalDoc: 0, isLoading: true, error: null,
  searchInput: "", currentPage: 1, checkedIds: [],
  searchDraft: "", pendingDelete: null, drawer: null, campaignFor: null,
};
let loadSeq = 0;
async function loadList() {
  const seq = ++loadSeq;
  L.isLoading = true;
  K.update();
  try {
    const result = await api.listCatalogues(locationId, { search: L.searchInput || undefined, page: L.currentPage, limit: PAGE_SIZE });
    if (seq !== loadSeq) return;
    L.items = result.catalogues.map(PM.mapCatalogue.mapCatalogueSummaryToListItem);
    L.totalDoc = result.totalDoc;
    L.checkedIds = [];
    L.isLoading = false;
    L.error = null;
  } catch (err) {
    if (seq !== loadSeq) return;
    L.isLoading = false;
    L.error = err;
    onNotify(`Something went wrong: ${err.message}`, "error");
  }
  K.update();
}
const refresh = () => loadList();
const isCheckAll = () => L.items.length > 0 && L.checkedIds.length === L.items.length;
async function removeCatalogue(id) {
  await api.deleteCatalogue(id);
  refresh();
}
async function bulkDelete(ids) {
  const results = await Promise.allSettled(ids.map((id) => api.deleteCatalogue(id)));
  refresh();
  const ok = results.filter((r) => r.status === "fulfilled").length;
  return { ok, failed: results.length - ok };
}

// ---- CatalogueListShell --------------------------------------------------------------------
const applySearch = K.debounce((v) => {
  L.searchInput = v;
  L.currentPage = 1;
  loadList();
}, 400);
K.on["list.search"] = (_, ev) => {
  L.searchDraft = ev.target.value;
  applySearch(L.searchDraft);
};
K.on["list.checkAll"] = () => (L.checkedIds = L.checkedIds.length === L.items.length ? [] : L.items.map((c) => c.id));
K.on["list.check"] = (id) => (L.checkedIds = L.checkedIds.includes(id) ? L.checkedIds.filter((x) => x !== id) : [...L.checkedIds, id]);
K.on["list.add"] = () => openDrawer({ mode: "create" });
K.on["list.edit"] = (id) => openDrawer({ mode: "edit", id });
K.on["list.delete"] = (id) => {
  const c = L.items.find((x) => x.id === id);
  L.pendingDelete = { kind: "single", id, name: c.displayName };
};
K.on["list.campaign"] = (id) => {
  const c = L.items.find((x) => x.id === id);
  openCampaign({ id, name: c.displayName });
};

async function handleConfirmDelete() {
  const pd = L.pendingDelete;
  if (!pd) return;
  if (pd.kind === "single") {
    await removeCatalogue(pd.id);
    onNotify(`Catalogue "${pd.name}" deleted`, "success");
    return;
  }
  const { ok, failed } = await bulkDelete(pd.ids);
  if (failed === 0) onNotify(`${ok} catalogue${ok === 1 ? "" : "s"} deleted`, "success");
  else onNotify(`${ok} deleted, ${failed} failed`, "error");
}

function skeleton() {
  const bar = (w) => `<div class="h-4 ${w} animate-pulse rounded bg-gray-200 dark:bg-gray-700"></div>`;
  const sq = `<div class="h-4 w-4 animate-pulse rounded bg-gray-200 dark:bg-gray-700"></div>`;
  return `<div class="w-full overflow-hidden ring-1 ring-black/5 rounded-lg overflow-x-auto" data-testid="catalogue-table-skeleton"><table class="w-full">
    ${thead(sq)}
    <tbody class="bg-white divide-y divide-gray-100 dark:divide-gray-700 dark:bg-gray-800">${Array.from({ length: 6 }, () => `<tr class="border-b border-gray-200">
      <td class="px-4 py-3">${sq}</td><td class="px-4 py-3">${bar("w-32")}</td><td class="px-4 py-3">${bar("w-40")}</td><td class="px-4 py-3">${bar("w-12")}</td><td class="px-4 py-3">${bar("w-12")}</td><td class="px-4 py-3">${bar("w-20")}</td>
      <td class="px-4 py-3"><div class="flex items-center gap-2">${sq}${sq}</div></td><td class="px-4 py-3"><div class="flex items-center gap-2">${sq}${sq}</div></td></tr>`).join("")}</tbody></table></div>`;
}
function thead(firstCell) {
  return `<thead class="text-sm font-medium tracking-wide text-left text-zinc-500 uppercase border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:text-gray-400 dark:bg-gray-800"><tr>
    <th class="px-4 py-2">${firstCell}</th><th class="px-4 py-2">Name</th><th class="px-4 py-2">Description</th><th class="px-4 py-2">Customers</th><th class="px-4 py-2">Products</th><th class="px-4 py-2">Last Modified</th><th class="px-4 py-2">Actions</th><th class="px-4 py-2">Import/Export</th></tr></thead>`;
}

function renderList() {
  if (L.error) return `<p role="alert" data-testid="catalogue-list-error">Something went wrong: ${K.esc(L.error.message)}</p>`;
  const totalPages = Math.max(1, Math.ceil(L.totalDoc / PAGE_SIZE));
  const actionsDisabled = L.checkedIds.length > 0;
  const bulkProps = (extra) => ({
    selectedIds: L.checkedIds,
    fallbackIds: L.items.map((i) => i.id),
    onDelete: (ids) => (L.pendingDelete = { kind: "bulk", ids }),
    onAutoSelect: () => onNotify("Select catalogues first, then choose a bulk action.", "error"),
    entityLabel: "Catalogue",
    deleteDescription: "Permanently remove the selected catalogues",
    ...extra,
  });
  const rows = L.items.length === 0
    ? `<tr><td colspan="8" data-testid="catalogue-list-empty" class="px-4 py-6 text-center text-gray-500 dark:text-gray-400">No catalogues found.</td></tr>`
    : L.items.map((c) => {
        const del = actionsDisabled || c.isDefault;
        return `<tr data-key="${c.id}" data-testid="catalogue-row-${c.id}" class="border-b border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700/40">
          <td class="px-4 py-2"><input type="checkbox"${K.attr("checked", L.checkedIds.includes(c.id))} data-on-change="list.check|${c.id}" data-testid="catalogue-row-checkbox-${c.id}" class="h-4 w-4 rounded border-gray-400 accent-emerald-600" aria-label="Select ${K.esc(c.displayName)}"></td>
          <td class="px-4 py-2"><span class="flex items-center text-sm font-semibold">${K.icon("FiTag", "mr-2 text-blue-600")}<span data-testid="catalogue-name-${c.id}">${K.esc(c.displayName)}</span></span></td>
          <td class="px-4 py-2 text-sm" data-testid="catalogue-description-${c.id}">${K.esc(c.descriptionLabel)}</td>
          <td class="px-4 py-2"><span class="flex items-center text-sm font-semibold">${K.icon("FiUsers", "mr-2 text-gray-400")}<span data-testid="catalogue-org-count-${c.id}">${c.orgCount}</span></span></td>
          <td class="px-4 py-2"><span class="flex items-center text-sm font-semibold">${K.icon("FiPackage", "mr-2 text-gray-400")}<span data-testid="catalogue-product-count-${c.id}">${c.productCount}</span></span></td>
          <td class="px-4 py-2 text-sm" data-testid="catalogue-modified-date-${c.id}">${c.modifiedAt ? new Date(c.modifiedAt).toLocaleDateString("en-GB") : "—"}</td>
          <td class="px-4 py-2"><div class="flex items-center gap-1">
            <button type="button"${K.attr("disabled", actionsDisabled)} data-on-click="list.edit|${c.id}" data-testid="catalogue-edit-btn-${c.id}" class="p-2 focus:outline-none ${actionsDisabled ? "text-gray-300" : "text-gray-600 hover:text-green-600"}" aria-label="Edit ${K.esc(c.displayName)}">${K.icon("FiEdit")}</button>
            <button type="button"${K.attr("disabled", del)}${K.attr("title", c.isDefault ? "DEFAULT catalog cannot be deleted" : undefined)} data-on-click="list.delete|${c.id}" data-testid="catalogue-delete-btn-${c.id}" class="p-2 focus:outline-none ${del ? "text-gray-300" : "text-gray-600 hover:text-red-600"}" aria-label="Delete ${K.esc(c.displayName)}">${K.icon("FiTrash2")}</button>
            <button type="button"${K.attr("disabled", actionsDisabled)} data-on-click="list.campaign|${c.id}" data-testid="catalogue-campaign-btn-${c.id}" class="p-2 focus:outline-none ${actionsDisabled ? "text-gray-300" : "text-gray-600 hover:text-blue-600"}" aria-label="Send Campaign for ${K.esc(c.displayName)}" title="Send Campaign">${K.icon("Send", "h-4 w-4")}</button>
          </div></td>
          <td class="px-4 py-2">${CsvActions(c.id, c.displayName)}</td>
        </tr>`;
      }).join("");

  return `<div>
    ${SHOW_HEADING ? `<h1 data-testid="catalogue-list-heading" class="mb-4 text-xl font-semibold text-gray-800 dark:text-gray-100">Catalogues</h1>` : ""}
    <div class="hidden md:block min-w-0 rounded-lg overflow-visible ring-1 ring-black/5 dark:bg-gray-800 mb-4"><div class="p-4 flex flex-col sm:flex-row gap-2">
      ${BulkActionDropdown("catalogue-bulk", bulkProps({ testIdPrefix: "catalogue-bulk-action" }))}
      <button type="button" data-on-click="list.add" data-testid="catalogue-add-btn" class="align-bottom inline-flex items-center justify-center cursor-pointer leading-5 transition-colors duration-150 font-medium focus:outline-none px-4 py-2 rounded-md text-sm text-white bg-green-600 border border-transparent hover:bg-green-700 h-10 w-full sm:w-auto sm:ml-auto">+ Add Catalog</button>
    </div></div>
    <div class="min-w-0 rounded-lg overflow-visible ring-1 ring-black/5 dark:bg-gray-800 mb-4"><div class="p-4 flex flex-col sm:flex-row gap-2">
      <input type="text" placeholder="Search by Catalog name" value="${K.esc(L.searchDraft)}" data-on-input="list.search" data-testid="catalogue-search-input" class="block w-full h-10 border border-gray-200 bg-white px-3 py-1 text-sm focus:outline-none dark:text-gray-300 leading-5 rounded-md focus:bg-white dark:focus:bg-gray-700 dark:border-gray-600">
    </div></div>
    ${L.isLoading ? skeleton() : `<div class="w-full overflow-hidden ring-1 ring-black/5 rounded-lg overflow-x-auto"><table class="w-full" data-testid="catalogue-table">
      ${thead(`<input type="checkbox"${K.attr("checked", isCheckAll())} data-on-change="list.checkAll" data-testid="catalogue-select-all-checkbox" class="h-4 w-4 rounded border-gray-400 accent-emerald-600" aria-label="Select all catalogues">`)}
      <tbody class="bg-white divide-y divide-gray-100 dark:divide-gray-700 dark:bg-gray-800 text-gray-800 dark:text-gray-400">${rows}</tbody></table></div>`}
    <div class="mt-4">${Pagination("catalogue-pagination", { currentPage: L.currentPage, totalPages, resultsPerPage: PAGE_SIZE, totalResults: L.totalDoc, testIdPrefix: "catalogue-pagination", onPageChange: (p) => ((L.currentPage = p), loadList()) })}</div>
    ${L.drawer ? CatalogueDrawer(L.drawer) : ""}
    ${DeleteModal("catalogue-delete", { open: L.pendingDelete !== null, title: L.pendingDelete?.kind === "single" ? L.pendingDelete.name : undefined, isBulk: L.pendingDelete?.kind === "bulk", onConfirm: handleConfirmDelete, onClose: () => (L.pendingDelete = null) })}
    ${L.campaignFor ? K.portal("campaign", CampaignModal(L.campaignFor)) : ""}
    ${CsvPreviewPortal()}
    <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 shadow-[0_-2px_12px_rgba(0,0,0,0.08)]"><div class="flex items-center justify-around px-1 py-2 pb-[env(safe-area-inset-bottom,8px)]">
      ${BulkActionDropdown("catalogue-bulk-mobile", bulkProps({ label: "Bulk Action", mobile: true, mobileVariant: "sheet", testIdPrefix: "catalogue-bulk-action-mobile" }))}
      <div class="h-8 w-px bg-gray-200"></div>
      <button type="button" data-on-click="list.add" data-testid="catalogue-add-btn-mobile" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-emerald-700 hover:bg-emerald-50"><span class="rounded-lg bg-emerald-600 px-3 py-1 text-white">${K.icon("FiPlus", "w-5 h-5")}</span><span class="text-[10px] font-medium">Add Catalog</span></button>
    </div></div>
    <div class="md:hidden h-16"></div>
  </div>`;
}

// ---- CatalogueDrawer + useCatalogueDrawerController -----------------------------------------
const DEFAULT_NAME = "DEFAULT";
const primaryBtnClass = "flex-grow-0 md:flex-grow inline-flex h-12 w-full items-center justify-center rounded-md bg-green-600 px-4 text-sm font-medium text-white transition-colors hover:bg-green-700 disabled:opacity-60 disabled:cursor-not-allowed";
const cancelBtnClass = "flex-grow-0 md:flex-grow inline-flex h-12 w-full items-center justify-center rounded-md border border-gray-200 bg-white px-4 text-sm font-medium text-red-500 transition-colors hover:border-red-100 hover:bg-red-50 hover:text-red-600 dark:border-gray-700 dark:bg-gray-700 dark:text-gray-500 dark:hover:bg-gray-800 dark:hover:text-red-700";
const badgeBase = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border";
const statusHighlightClass = { all: "bg-green-50 border-green-200", partial: "bg-blue-50 border-blue-200", none: "bg-white hover:bg-gray-50 border-transparent" };

function openDrawer(spec) {
  const catalogueId = spec.mode === "edit" ? spec.id : undefined;
  const d = {
    mode: spec.mode, catalogueId,
    step: "basic", isLoading: true, loadError: null,
    name: "", desc: "", basicInfoError: null, existingCatalogue: null,
    allProducts: [], categoryOptions: [], unitOptions: [], selectedIds: new Set(),
    productSearch: "", productCategoryFilter: undefined, priceFilter: "all",
    selectionMode: "category", expandedCategoryIds: new Set(),
    rows: [], pricesDirty: false, isSaving: false, saveError: null, snapshot: null,
    priceEditRowId: null, showDiscardModal: false, everReachedSelect: spec.mode === "edit",
  };
  L.drawer = d;
  (async () => {
    try {
      const catalogue = catalogueId ? await api.getCatalogue(catalogueId) : null;
      if (L.drawer !== d) return;
      const sourceCatalogueType = catalogue && catalogue.name.toUpperCase() === DEFAULT_NAME ? "MASTER" : "DEFAULT";
      const [products, categoryTree, units] = await Promise.all([api.exportProducts(locationId, { catalogueType: sourceCatalogueType }), api.listCategories(locationId), api.getUnitOptions(locationId)]);
      if (L.drawer !== d) return;
      d.existingCatalogue = catalogue;
      d.name = catalogue?.name ?? "";
      d.desc = catalogue?.desc ?? "";
      const initial = (catalogue?.products ?? []).map((p) => p.id);
      d.selectedIds = new Set(initial);
      d.snapshot = { name: catalogue?.name ?? "", desc: catalogue?.desc ?? "", productIds: [...initial].sort() };
      d.allProducts = products;
      d.categoryOptions = PM.mapProduct.mapCategoryTreeToOptions(categoryTree);
      d.unitOptions = Object.values(units);
      d.isLoading = false;
      d.loadError = null;
    } catch (err) {
      if (L.drawer !== d) return;
      d.isLoading = false;
      d.loadError = err;
    }
    K.update();
  })();
}
const D = () => L.drawer;
const isNameLocked = (d) => (d.existingCatalogue?.name ?? "").toUpperCase() === DEFAULT_NAME;
function isDirty(d) {
  const snap = d.snapshot;
  if (!snap) return false;
  if (d.name.trim() !== snap.name) return true;
  if (d.desc !== snap.desc) return true;
  const cur = Array.from(d.selectedIds).sort();
  if (cur.length !== snap.productIds.length || cur.some((id, i) => id !== snap.productIds[i])) return true;
  return d.pricesDirty;
}
function setStep(d, step) {
  d.step = step;
  if (step === "select" || step === "pricing") d.everReachedSelect = true;
}
function goToSelect(d) {
  const trimmed = d.name.trim();
  if (!isNameLocked(d)) {
    if (!trimmed) return (d.basicInfoError = "Catalog Name is required");
    if (trimmed.toUpperCase() === DEFAULT_NAME) return (d.basicInfoError = "Catalog Name cannot be 'DEFAULT'");
  }
  d.basicInfoError = null;
  setStep(d, "select");
}
function goToPricing(d) {
  d.rows = PM.catalogueDrawer.buildPricingRows(d.allProducts, d.selectedIds, d.existingCatalogue);
  d.pricesDirty = false;
  setStep(d, "pricing");
}
function applyPriceEdit(d, productId, payload) {
  const unitIndex = PM.unitLevel.getPriceCalculationUnitIndex();
  const unitPrices = [payload.price, payload.baseUnitPrice, payload.palletUnitPrice];
  const newCatalogPrice = Number(unitPrices[unitIndex] ?? payload.price ?? 0);
  const { offerPriceMap } = PM.unitPriceMapping.unitPriceSaveToWriteFields(payload);
  const palletKey = payload.palletUnit || "Pallet";
  if (offerPriceMap[palletKey] === undefined) offerPriceMap[palletKey] = payload.palletUnitPrice;
  d.rows = d.rows.map((r) => (r.productId === productId ? { ...r, catalogPrice: newCatalogPrice, offerPriceMap } : r));
  d.pricesDirty = true;
}
async function save(d) {
  d.isSaving = true;
  d.saveError = null;
  K.update();
  try {
    const products = d.rows.map((r) => ({ id: r.productId, price: r.price, offerPrice: r.catalogPrice, priceMap: r.priceMap, offerPriceMap: r.offerPriceMap, tax: r.tax }));
    const trimmed = d.name.trim();
    const result = d.catalogueId
      ? await api.updateCatalogue(d.catalogueId, { name: isNameLocked(d) ? undefined : trimmed, desc: d.desc, products })
      : await api.createCatalogue(locationId, { name: trimmed, desc: d.desc, products });
    // CatalogueListShell#onSaved
    const mode = d.mode;
    L.drawer = null;
    refresh();
    onNotify(`Catalogue "${result.name}" ${mode === "create" ? "created" : "updated"}`, "success");
  } catch (err) {
    d.saveError = err.message;
  } finally {
    d.isSaving = false;
    K.update();
  }
}
function handleClose() {
  const d = D();
  if (isDirty(d)) return (d.showDiscardModal = true);
  L.drawer = null;
}

K.on["cd.name"] = (_, ev) => (D().name = ev.target.value);
K.on["cd.desc"] = (_, ev) => (D().desc = ev.target.value);
K.on["cd.close"] = () => handleClose();
K.on["cd.next"] = () => goToSelect(D());
K.on["cd.backBasic"] = () => setStep(D(), "basic");
K.on["cd.backSelect"] = () => setStep(D(), "select");
K.on["cd.continue"] = () => goToPricing(D());
K.on["cd.save"] = () => save(D());
K.on["cd.tab"] = (key) => {
  const d = D();
  if (d.step === key) return;
  if (key === "basic") setStep(d, "basic");
  else if (key === "select") d.step === "pricing" ? setStep(d, "select") : goToSelect(d);
  else goToPricing(d);
};
K.on["cd.mode"] = (_, ev) => (D().selectionMode = ev.target.value);
K.on["cd.selectAll"] = () => (D().selectedIds = new Set(D().allProducts.map((p) => p.id)));
K.on["cd.clearAll"] = () => (D().selectedIds = new Set());
K.on["cd.expand"] = (id) => {
  const s = new Set(D().expandedCategoryIds);
  s.has(id) ? s.delete(id) : s.add(id);
  D().expandedCategoryIds = s;
};
K.on["cd.toggleCat"] = (arg) => {
  const d = D();
  const [kind, id] = arg.split(":");
  const root = d.categoryOptions.find((c) => c.id === id);
  const ids = (kind === "root" ? PM.catalogueDrawer.productsInCategoryTree(d.allProducts, root) : PM.catalogueDrawer.productsInCategory(d.allProducts, id)).map((p) => p.id);
  if (ids.length === 0) return;
  const allSelected = ids.every((x) => d.selectedIds.has(x));
  const next = new Set(d.selectedIds);
  for (const x of ids) allSelected ? next.delete(x) : next.add(x);
  d.selectedIds = next;
};
K.on["cd.toggleProduct"] = (id) => {
  const next = new Set(D().selectedIds);
  next.has(id) ? next.delete(id) : next.add(id);
  D().selectedIds = next;
};
K.on["cd.search"] = (_, ev) => (D().productSearch = ev.target.value);
K.on["cd.catFilter"] = (_, ev) => (D().productCategoryFilter = ev.target.value || undefined);
K.on["cd.priceFilter"] = (_, ev) => (D().priceFilter = ev.target.value);
K.on["cd.editPrice"] = (id) => (D().priceEditRowId = id);

function categoryTreeRow({ id, label, productCount, status, isSubcategory, toggleArg, isExpanded, canExpand }) {
  return `<div data-testid="catalogue-drawer-category-row-${id}" data-selection-status="${status}" class="flex items-center justify-between gap-2 rounded-md border px-2 py-2 transition-colors ${isSubcategory ? "ml-6 border-l-2 pl-3" : ""} ${statusHighlightClass[status]}">
    <div class="flex min-w-0 items-center gap-2">
      ${canExpand ? `<button type="button" data-on-click="cd.expand|${id}" data-testid="catalogue-drawer-category-expand-${id}" data-status="${isExpanded ? "expanded" : "collapsed"}" aria-label="${isExpanded ? "Collapse" : "Expand"} ${K.esc(label)}" class="text-gray-500 hover:text-gray-700">${K.icon(isExpanded ? "ChevronDown" : "ChevronRight", "h-4 w-4").replace("<svg", `<svg data-testid="catalogue-drawer-category-expand-icon-${id}"`)}</button>` : ""}
      <span data-testid="catalogue-drawer-category-label-${id}" class="truncate font-medium text-gray-800 ${isSubcategory ? "text-sm" : ""}">${K.esc(label)}</span>
      <span data-testid="catalogue-drawer-category-count-${id}" class="shrink-0 text-xs text-gray-500">${productCount} Product${productCount === 1 ? "" : "s"}</span>
      ${status === "all" ? K.icon("Check", "h-4 w-4 shrink-0 text-green-600") : status === "partial" ? K.icon("Minus", "h-4 w-4 shrink-0 text-blue-600") : ""}
    </div>
    <button type="button" data-on-click="cd.toggleCat|${toggleArg}"${K.attr("disabled", productCount === 0)} data-testid="catalogue-drawer-category-toggle-${id}" class="shrink-0 rounded border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50">${status === "all" ? (isSubcategory ? "Deselect" : "Deselect All") : isSubcategory ? "Select" : "Select All"}</button>
  </div>`;
}

function CatalogueDrawer(d) {
  const title = d.mode === "create" ? "Add Catalog" : "Update Catalog";
  if (d.isLoading) return SlideDrawer("catalogue-drawer", { open: true, onClose: () => (L.drawer = null), title, testId: "catalogue-drawer", children: `<p data-testid="catalogue-drawer-loading">Loading…</p>` });

      <span data-testid="catalogue-drawer-pricing-count" class="mb-4 ${badgeBase} bg-gray-100 text-gray-800 border-gray-300">${d.rows.length} Products to Price</span>
      <div class="border border-gray-200 rounded-lg h-full overflow-auto max-h-96" data-testid="catalogue-drawer-pricing-table">
        <div class="${gridCols} bg-gray-50 text-[10px] sm:text-sm font-semibold text-gray-600 px-4 py-3 sticky top-0 z-10">${["Product", "Base Price", "Unit", "Catalog Price"].map((h) => `<div class="px-2 xl:px-6 text-left text-[10px] sm:text-xs font-medium text-gray-500 uppercase tracking-wider">${h}</div>`).join("")}<div class="px-2 xl:px-6 text-center text-[10px] sm:text-xs font-medium text-gray-500 uppercase tracking-wider">Margin</div></div>
        ${d.rows.map((r) => {
          const margin = cdm.computeMargin(r);

          return `<div data-key="${r.productId}" data-testid="catalogue-drawer-pricing-row-${r.productId}" class="${gridCols} items-center text-xs sm:text-sm font-semibold text-gray-600 px-4 py-1 hover:bg-gray-50">

              <button type="button" data-on-click="cd.editPrice|${r.productId}" data-testid="catalogue-drawer-edit-price-btn-${r.productId}" class="shrink-0 px-2 py-1.5 h-7 sm:h-8 border !border-blue-200 rounded text-xs sm:text-sm !bg-blue-50 !text-blue-700 hover:!text-gray-700 hover:!bg-blue-100 inline-flex items-center gap-1" aria-label="Edit price — ${K.esc(r.productName)}">${K.icon("FiEdit")}</button></div>

// ---- CataloguePricingCsvActions ------------------------------------------------------------
const csvState = (id) => K.state(`csv:${id}`, { isExporting: false, previewRows: null, isEditing: false, isImporting: false, name: "" });
function CsvActions(id, name) {
  const s = csvState(id);
  s.name = name;
  return `<div class="flex items-center justify-start gap-1 pl-5">
    <button type="button" data-on-click="csv.pick|${id}" data-testid="catalogue-csv-import-btn-${id}" aria-label="Import pricing CSV for ${K.esc(name)}" class="p-2 focus:outline-none text-gray-500 hover:text-green-600 dark:text-gray-300">${K.icon("Upload", "h-4 w-4")}</button>
    <input type="file" accept=".csv" class="hidden" data-on-change="csv.file|${id}" data-testid="catalogue-csv-file-input-${id}">
    <button type="button" data-on-click="csv.export|${id}"${K.attr("disabled", s.isExporting)} data-testid="catalogue-csv-export-btn-${id}" aria-label="Export pricing CSV for ${K.esc(name)}" class="p-2 focus:outline-none text-gray-500 hover:text-blue-600 disabled:opacity-50 dark:text-gray-300">${K.icon("Download", "h-4 w-4")}</button>
  </div>`;
}
K.on["csv.pick"] = (id, ev, el) => el.parentElement.querySelector('input[type="file"]').click();
K.on["csv.export"] = async (id) => {
  const s = csvState(id);
  s.isExporting = true;
  K.update();
  try {
    const [catalogue, products] = await Promise.all([api.getCatalogue(id), api.exportProducts(locationId, {})]);
    if (!catalogue) return;
    const csv = PM.catalogueCsv.catalogueExportRowsToCsv(PM.catalogueCsv.buildCatalogueExportRows(catalogue, products));
    K.download("catalog-pricing.csv", new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  } finally {
    s.isExporting = false;
    K.update();
  }
};
K.on["csv.file"] = async (id, ev) => {
  const file = ev.target.files?.[0];
  ev.target.value = "";
  if (!file) return;
  const text = await K.readText(file);
  const { missingHeaders, rows } = PM.catalogueCsv.parseCataloguePricingCsv(text);
  if (missingHeaders.length > 0) {
    onNotify(`Invalid CSV format — missing column(s): ${missingHeaders.join(", ")}`, "error");
    return;
  }
  const s = csvState(id);
  s.isEditing = false;
  s.previewRows = rows;
  K.update();
};
K.on["csv.editToggle"] = (id) => (csvState(id).isEditing = !csvState(id).isEditing);
K.on["csv.close"] = (id) => (csvState(id).previewRows = null);
K.on["csv.doneEditing"] = (id) => (csvState(id).isEditing = false);
K.on["csv.price"] = (arg, ev) => {
  const [id, i] = arg.split("|");
  const value = ev.target.value;
  if (!/^\d*\.?\d{0,2}$/.test(value)) return;
  const s = csvState(id);
  s.previewRows = s.previewRows.map((r, idx) => (idx === Number(i) ? { ...r, catalogPrice: Number(value) || 0 } : r));
};
K.on["csv.import"] = async (id) => {
  const s = csvState(id);
  if (!s.previewRows) return;
  s.isImporting = true;
  K.update();
  try {
    const [catalogue, allProducts] = await Promise.all([api.getCatalogue(id), api.exportProducts(locationId, {})]);
    if (!catalogue) return;
    const c = PM.catalogueCsv;
    const { products, appliedCount, skippedCount } = c.applyCsvRowsToCatalogueProducts(catalogue.products, s.previewRows, c.productIdByArticleNumber(allProducts), c.productsById(allProducts));
    await api.updateCatalogue(id, { products: products.map((p) => ({ id: p.id, price: p.price ?? 0, offerPrice: p.offerPrice, priceMap: p.priceMap, offerPriceMap: p.offerPriceMap, tax: p.tax })) });
    onNotify(`${appliedCount} price${appliedCount === 1 ? "" : "s"} updated${skippedCount > 0 ? `, ${skippedCount} row(s) skipped (not in this catalogue)` : ""}`, "success");
    s.previewRows = null;
    refresh();
  } catch (err) {
    onNotify(err.message, "error");
  } finally {
    s.isImporting = false;
    K.update();
  }
};
function CsvPreviewPortal() {
  return L.items.map((c) => {
    const id = c.id;
    const s = csvState(id);
    if (!s.previewRows) return "";
    const fmt = PM.format;
    return K.portal(`csv:${id}`, `<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 px-2 sm:px-4 py-4">
      <div data-testid="catalogue-csv-preview-modal" class="w-full max-w-5xl sm:max-w-6xl max-h-[85vh] sm:max-h-[90vh] min-h-[40vh] bg-white rounded-xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        <div class="px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center justify-between gap-2 border-b">
          <h2 class="text-base sm:text-lg md:text-xl font-semibold text-gray-900">Preview Catalogue Pricing CSV</h2>
          <div class="flex items-center gap-3">
            <button type="button" data-on-click="csv.editToggle|${id}" data-testid="catalogue-csv-preview-edit-toggle" data-status="${s.isEditing ? "editing" : "not-editing"}" class="flex items-center text-xs sm:text-sm text-indigo-600 hover:text-indigo-700 transition-colors">${s.isEditing ? "Done Editing" : "Edit"}</button>
            <button type="button" data-on-click="csv.close|${id}" aria-label="Close" class="p-1 rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">${K.icon("X", "h-4 w-4")}</button>
          </div>
        </div>
        <div class="px-3 sm:px-6 py-3 sm:py-4 flex-1 flex flex-col"><div class="border border-gray-200 rounded-xl flex-1 flex flex-col"><div class="flex-1 max-h-[50vh] sm:max-h-[60vh] overflow-x-auto overflow-y-auto">
          <table class="w-full min-w-full text-[11px] sm:text-xs md:text-sm table-fixed" data-testid="catalogue-csv-preview-table">
            <thead class="bg-gray-50 sticky top-0 z-10"><tr class="border-b">
              <th class="px-3 py-2 text-center font-semibold text-gray-700 w-10">#</th><th class="px-3 py-2 text-center font-semibold text-gray-700 w-40">Article No</th><th class="px-3 py-2 text-center font-semibold text-gray-700 w-64">Product</th><th class="px-3 py-2 text-center font-semibold text-gray-700 w-32">Base Price</th><th class="px-3 py-2 text-center font-semibold text-gray-700 w-32">Unit</th>
              <th class="px-3 py-2 text-center font-semibold w-32 ${s.isEditing ? "text-green-700 bg-green-50" : "text-gray-700"}">Catalog Price${s.isEditing ? " (editable)" : ""}</th></tr></thead>
            <tbody>${s.previewRows.map((row, i) => {
              const tax = fmt.formatTaxLabel(row.tax);
              return `<tr data-testid="catalogue-csv-preview-row-${i}" class="border-t hover:bg-gray-50 transition-colors">
                <td class="px-3 py-2 text-center whitespace-nowrap">${i + 1}</td>
                <td class="px-3 py-2 text-center whitespace-nowrap" data-testid="catalogue-csv-preview-article-number-${i}">${K.esc(row.articleNumber || "—")}</td>
                <td class="px-3 py-2 text-center whitespace-nowrap" data-testid="catalogue-csv-preview-name-${i}">${K.esc(row.productName || "—")}</td>

                <td class="px-3 py-2 text-center whitespace-nowrap" data-testid="catalogue-csv-preview-unit-${i}">${K.esc(row.unit || "—")}</td>
                <td class="px-3 py-2 text-center whitespace-nowrap">${s.isEditing
                  ? `<input type="text" value="${K.esc(row.catalogPrice)}" data-on-input="csv.price|${id}|${i}" data-testid="catalogue-csv-preview-price-input-${i}" class="h-8 w-24 rounded border border-gray-300 px-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">`
                  : `<span data-testid="catalogue-csv-preview-catalog-price-${i}">${K.esc(fmt.formatPrice(row.catalogPrice))}${tax ? `<span class="block text-[10px] text-gray-400">${tax}</span>` : ""}</span>`}</td></tr>`;
            }).join("")}</tbody></table></div></div></div>
        <div class="flex-shrink-0 border-t bg-gray-50"><div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-2 sm:gap-3 px-3 sm:px-6 py-3">
          <button type="button" data-on-click="csv.close|${id}" data-testid="catalogue-csv-preview-cancel-btn" class="w-full sm:w-auto px-4 sm:px-5 py-2 text-xs sm:text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-100 border border-gray-300 transition-colors">Cancel</button>
          ${s.isEditing
            ? `<button type="button" data-on-click="csv.doneEditing|${id}" data-testid="catalogue-csv-preview-save-btn" class="w-full sm:w-auto px-4 sm:px-5 py-2 text-xs sm:text-sm font-semibold rounded-lg text-white bg-indigo-500 hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Save</button>`
            : `<button type="button" data-on-click="csv.import|${id}"${K.attr("disabled", s.isImporting)} data-testid="catalogue-csv-preview-import-btn" class="w-full sm:w-auto px-4 sm:px-5 py-2 text-xs sm:text-sm font-semibold rounded-lg text-white bg-green-500 hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">${s.isImporting ? "Importing…" : "Import"}</button>`}
        </div></div>
      </div></div>`);
  }).join("");
}

// ---- CatalogueSendCampaignModal ------------------------------------------------------------
function openCampaign(cf) {
  const m = { ...cf, viewMode: "loading", recipients: [], selected: [], rows: [], searchQuery: "", showFAQ: false, isSendingAll: false };
  L.campaignFor = m;
  api.listCampaignRecipients(cf.id).then((list) => {
    if (L.campaignFor !== m) return;
    m.recipients = list;
    m.selected = list.map((r) => r.id);
    m.viewMode = "selection";
    K.update();
  }).catch((err) => {
    if (L.campaignFor !== m) return;
    onNotify(err.message, "error");
    L.campaignFor = null;
    K.update();
  });
}
const M = () => L.campaignFor;
const applyResults = (m, results) => {
  m.rows = m.rows.map((r) => {
    const res = results.find((x) => x.customerId === r.customerId);
    if (!res) return r;
    const row = { ...r, status: res.success ? "sent" : "failed" };
    if (res.error) row.error = res.error;
    else delete row.error;
    return row;
  });
};
K.on["cm.close"] = () => (L.campaignFor = null);
K.on["cm.faq"] = () => (M().showFAQ = !M().showFAQ);
K.on["cm.search"] = (_, ev) => (M().searchQuery = ev.target.value);
K.on["cm.all"] = (_, ev) => (M().selected = ev.target.checked ? M().recipients.map((r) => r.id) : []);
K.on["cm.one"] = (id, ev) => (M().selected = ev.target.checked ? [...M().selected, id] : M().selected.filter((x) => x !== id));
K.on["cm.create"] = () => {
  const m = M();
  if (m.selected.length === 0) return onNotify("Please select at least one customer", "error");
  m.rows = m.selected.map((id) => {
    const r = m.recipients.find((x) => x.id === id);
    const row = { customerId: id, name: r?.name || "Customer", status: "ready" };
    if (r?.phone) row.phone = r.phone;
    return row;
  });
  m.searchQuery = "";
  m.viewMode = "results";
  onNotify(`${m.rows.length} campaign link${m.rows.length === 1 ? "" : "s"} created successfully!`, "success");
};
K.on["cm.sendOne"] = async (customerId) => {
  const m = M();
  const row = m.rows.find((r) => r.customerId === customerId);
  m.rows = m.rows.map((r) => (r.customerId === customerId ? { ...r, status: "sending" } : r));
  K.update();
  try {
    const results = await api.sendCampaign(m.id, [customerId], window.location.origin);
    applyResults(m, results);
    const res = results[0];
    if (res?.success) onNotify(`Sent to ${row?.name ?? "customer"} via WhatsApp!`, "success");
    else onNotify(`Failed to send to ${row?.name ?? "customer"}${res?.error ? `: ${res.error}` : ""}`, "error");
  } catch (err) {
    m.rows = m.rows.map((r) => (r.customerId === customerId ? { ...r, status: "failed", error: err.message } : r));
    onNotify(err.message, "error");
  }
  K.update();
};
K.on["cm.sendAll"] = async () => {
  const m = M();
  if (m.rows.length === 0 || m.isSendingAll) return;
  m.isSendingAll = true;
  const ids = m.rows.map((r) => r.customerId);
  m.rows = m.rows.map((r) => ({ ...r, status: "sending" }));
  K.update();
  try {
    const results = await api.sendCampaign(m.id, ids, window.location.origin);
    applyResults(m, results);
    const ok = results.filter((r) => r.success).length;
    const failed = results.length - ok;
    if (ok > 0) onNotify(`${ok} notification${ok === 1 ? "" : "s"} sent via WhatsApp!`, "success");
    if (failed > 0) onNotify(`${failed} notification${failed === 1 ? "" : "s"} failed to send`, "error");
  } catch (err) {
    onNotify(err.message, "error");
    m.rows = m.rows.map((r) => (r.status === "sending" ? { ...r, status: "failed" } : r));
  } finally {
    m.isSendingAll = false;
    K.update();
  }
};
K.on["cm.more"] = () => Object.assign(M(), { viewMode: "selection", rows: [], searchQuery: "" });

function statusBadge(status) {
  const b = (color, iconName, label, spin) => `<div class="flex items-center gap-1.5 text-${color}-600 dark:text-${color}-400">${K.icon(iconName, `w-4 h-4${spin ? " animate-spin" : ""}`)}<span class="font-medium">${label}</span></div>`;
  if (status === "sending") return b("blue", "Loader2", "Sending", true);
  if (status === "sent") return b("green", "CheckCircle2", "Sent");
  if (status === "failed") return b("red", "AlertCircle", "Failed");
  return b("green", "CheckCircle2", "Ready");
}
function CampaignModal(m) {
  const q = m.searchQuery.toLowerCase();
  const filteredRecipients = m.recipients.filter((r) => !m.searchQuery || (r.name ?? "").toLowerCase().includes(q) || (r.phone ?? "").toLowerCase().includes(q) || (r.email ?? "").toLowerCase().includes(q));
  const filteredRows = m.rows.filter((r) => !m.searchQuery || r.name.toLowerCase().includes(q) || (r.phone ?? "").toLowerCase().includes(q));
  const isAllSelected = m.recipients.length > 0 && m.selected.length === m.recipients.length;
  const searchInput = (testId) => `<input type="text" placeholder="Search by name, phone, or email..." value="${K.esc(m.searchQuery)}" data-on-input="cm.search" data-testid="${testId}" class="w-full px-3 py-2 pr-9 text-sm border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 dark:bg-gray-700 dark:text-gray-200 placeholder-gray-400">`;
  const helpIcon = K.icon("HelpCircle", "w-3.5 h-3.5 text-gray-400 hover:text-blue-500 cursor-help flex-shrink-0").replace("<svg", `<svg data-on-click="cm.faq" data-testid="catalogue-campaign-faq-toggle" data-status="${m.showFAQ ? "expanded" : "collapsed"}"`);
  let body = "";
  if (m.viewMode === "loading") body = `<div data-testid="catalogue-campaign-loading" class="flex-1 flex items-center justify-center">${K.icon("Loader2", "w-6 h-6 animate-spin text-gray-400")}</div>`;
  else if (m.viewMode === "selection") {
    const list = m.recipients.length === 0
      ? `<div data-testid="catalogue-campaign-empty-no-recipients" class="flex flex-col items-center justify-center py-16 px-6 text-center"><div class="w-16 h-16 rounded-full bg-blue-500/10 dark:bg-blue-500/20 flex items-center justify-center mb-4">${K.icon("Users", "w-8 h-8 text-blue-500 dark:text-blue-400")}</div><h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-2">No Customers Assigned</h3><p class="text-sm text-gray-600 dark:text-gray-400 max-w-md">Assign customers to this catalogue to create personalized campaign links for direct ordering.</p></div>`
      : `<div class="mb-2 px-3 py-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg flex items-start gap-2">${K.icon("Info", "w-4 h-4 text-amber-600 dark:text-amber-400 flex-shrink-0 mt-0.5")}<p class="text-xs text-amber-700 dark:text-amber-300 leading-relaxed">Click on a customer to remove them from the campaign.</p></div>
        <div class="mb-2 pb-2 border-b border-gray-200 dark:border-gray-700"><div class="flex items-center"><input type="checkbox"${K.attr("checked", isAllSelected)} data-on-change="cm.all" data-testid="catalogue-campaign-select-all" class="h-4 w-4 rounded border-gray-400 accent-emerald-600"><span class="ml-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">Select All</span><span data-testid="catalogue-campaign-selected-count" class="ml-auto text-xs text-gray-500 dark:text-gray-400">${m.selected.length} / ${m.recipients.length} selected</span></div></div>
        ${filteredRecipients.length === 0
          ? `<div data-testid="catalogue-campaign-empty-search" class="flex flex-col items-center justify-center py-16 text-center"><p class="text-sm text-gray-500 dark:text-gray-400">No customers found</p></div>`
          : `<div class="grid grid-cols-1 md:grid-cols-2 gap-2">${filteredRecipients.map((r) => {
              const on = m.selected.includes(r.id);
              return `<label data-key="${r.id}" data-testid="catalogue-campaign-recipient-${r.id}" class="flex items-center px-3 py-2 rounded-md border cursor-pointer transition-all ${on ? "border-green-500 bg-green-50 dark:bg-green-900/20" : "border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700/30"}">
                <input type="checkbox"${K.attr("checked", on)} data-on-change="cm.one|${r.id}" data-testid="catalogue-campaign-recipient-checkbox-${r.id}" class="h-4 w-4 rounded border-gray-400 accent-emerald-600">
                <div class="ml-2.5 flex-1 min-w-0"><div data-testid="catalogue-campaign-recipient-name-${r.id}" class="text-sm font-medium text-gray-800 dark:text-gray-200 truncate">${K.esc(r.name || "Unnamed Customer")}</div>${r.phone ? `<div data-testid="catalogue-campaign-recipient-phone-${r.id}" class="text-xs text-gray-500 dark:text-gray-400 truncate">${K.esc(r.phone)}</div>` : ""}</div></label>`;
            }).join("")}</div>`}`;
    body = `<div class="flex-1 overflow-y-auto px-5 py-3"><div class="mb-3 relative">${searchInput("catalogue-campaign-search-input")}</div>${list}</div>
      <div class="flex-shrink-0 px-5 py-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50"><div class="flex items-center justify-between gap-3">
        <span data-testid="catalogue-campaign-footer-selected-count" class="text-sm text-gray-600 dark:text-gray-400 font-medium">${m.selected.length} selected</span>
        <button type="button" data-on-click="cm.create"${K.attr("disabled", m.selected.length === 0)} data-testid="catalogue-campaign-create-links-btn" class="px-4 py-2 text-sm font-semibold text-white bg-green-600 hover:bg-green-700 disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed rounded-lg transition-colors flex items-center gap-2">${K.icon("Send", "w-4 h-4")}Create Links</button>
      </div></div>`;
  } else {
    body = `<div class="flex-shrink-0 px-5 py-2.5 border-b bg-green-50/50 dark:bg-green-900/10 border-green-200 dark:border-green-800"><div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">${K.icon("CheckCircle2", "w-4 h-4 text-green-600 dark:text-green-400")}<div><span data-testid="catalogue-campaign-ready-count" class="text-sm font-semibold text-green-800 dark:text-green-200">${m.rows.length} of ${m.rows.length} ready</span><div class="text-sm text-green-600 dark:text-green-400">Click Send to notify a customer, or Send All to notify everyone.</div></div></div>
        <button type="button" data-on-click="cm.sendAll"${K.attr("disabled", m.isSendingAll)} data-testid="catalogue-campaign-send-all-btn" class="px-3 py-1.5 text-sm font-semibold text-white bg-amber-600 hover:bg-amber-700 disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed rounded-lg transition-colors flex items-center gap-2">${m.isSendingAll ? K.icon("Loader2", "w-4 h-4 animate-spin") : K.icon("Bell", "w-4 h-4")}Send All</button>
      </div></div>
      <div class="flex-shrink-0 px-5 py-2.5 border-b border-gray-200 dark:border-gray-700 bg-gray-50/30 dark:bg-gray-800/30">${searchInput("catalogue-campaign-results-search-input")}</div>
      <div class="flex-1 overflow-y-auto"><table class="w-full text-sm" data-testid="catalogue-campaign-results-table">
        <thead class="sticky top-0 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 z-10"><tr><th class="text-left px-4 py-2.5 font-semibold text-gray-700 dark:text-gray-300">Customer</th><th class="text-left px-4 py-2.5 font-semibold text-gray-700 dark:text-gray-300">Phone</th><th class="text-left px-4 py-2.5 font-semibold text-gray-700 dark:text-gray-300">Link Status</th><th class="text-right px-4 py-2.5 font-semibold text-gray-700 dark:text-gray-300">Action</th></tr></thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">${filteredRows.map((row) => `<tr data-key="${row.customerId}" data-testid="catalogue-campaign-results-row-${row.customerId}" data-status="${row.status}" class="hover:bg-green-50/30 dark:hover:bg-green-900/5">
          <td class="px-4 py-2.5 font-medium text-gray-800 dark:text-gray-200" data-testid="catalogue-campaign-results-name-${row.customerId}">${K.esc(row.name)}</td>
          <td class="px-4 py-2.5 text-gray-600 dark:text-gray-400" data-testid="catalogue-campaign-results-phone-${row.customerId}">${K.esc(row.phone || "-")}</td>
          <td class="px-4 py-2.5" data-testid="catalogue-campaign-results-status-${row.customerId}">${statusBadge(row.status)}</td>
          <td class="px-4 py-2.5 text-right"><button type="button" data-on-click="cm.sendOne|${row.customerId}"${K.attr("disabled", row.status === "sending")} data-testid="catalogue-campaign-send-btn-${row.customerId}" aria-label="Send notification to ${K.esc(row.name)}" class="p-2 border border-amber-200 hover:bg-amber-50 rounded-md bg-amber-50 text-amber-700 disabled:opacity-50">${K.icon("Bell", "w-4 h-4")}</button></td></tr>`).join("")}</tbody></table></div>
      <div class="flex-shrink-0 px-5 py-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50"><div class="flex items-center justify-between gap-2">
        <button type="button" data-on-click="cm.more" data-testid="catalogue-campaign-create-more-btn" class="px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">← Create More</button>
        <button type="button" data-on-click="cm.close" data-testid="catalogue-campaign-done-btn" class="px-4 py-2 text-sm font-semibold text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors">Done</button>
      </div></div>`;
  }
  return `<div class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm" data-on-click="cm.close"></div>
    <div class="fixed inset-0 z-[61] overflow-hidden flex items-center justify-center p-3 sm:p-6">
      <div data-testid="catalogue-campaign-modal" class="relative w-full max-w-4xl h-[92vh] bg-white dark:bg-gray-800 rounded-xl shadow-2xl flex flex-col" data-on-click="noop">
        <div class="flex-shrink-0 px-5 py-3 border-b border-gray-200 dark:border-gray-700">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-blue-500/10 dark:bg-blue-500/20 flex items-center justify-center">${K.icon("Send", "w-5 h-5 text-blue-600 dark:text-blue-400")}</div>
              <div class="flex-1 min-w-0"><div class="flex items-center gap-2"><h2 class="text-base font-semibold text-gray-900 dark:text-gray-100 truncate">Create Campaign Links</h2>${helpIcon}</div>
                <p data-testid="catalogue-campaign-catalogue-name" class="text-xs text-gray-600 dark:text-gray-400 mt-0.5 truncate">${K.esc(m.name)}</p></div>

          ${m.viewMode === "selection" ? `<div class="mt-2.5 px-3 py-2 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg">
            <div class="flex items-start gap-2">${K.icon("Info", "w-4 h-4 text-blue-600 dark:text-blue-400 flex-shrink-0 mt-0.5")}<p class="text-sm text-blue-700 dark:text-blue-300 leading-relaxed">Create personalized campaign links for customers to place orders directly from your Catalog.<button type="button" data-on-click="cm.faq" data-testid="catalogue-campaign-more-info-toggle" data-status="${m.showFAQ ? "expanded" : "collapsed"}" class="ml-2 text-blue-600 dark:text-blue-400 hover:underline font-medium">${m.showFAQ ? "Less" : "More info"}</button></p></div>
            ${m.showFAQ ? `<div class="mt-3 pt-3 border-t border-blue-200 dark:border-blue-800 space-y-2 text-sm"><p class="text-blue-700 dark:text-blue-300"><span class="font-semibold">Are links secure?</span> Yes, a unique campaign link is generated per customer.</p><p class="text-blue-700 dark:text-blue-300"><span class="font-semibold">How it works?</span> Customers click the link → View products → Place order instantly.</p></div>` : ""}
          </div>` : ""}
        </div>
        ${body}
      </div>
    </div>`;
}

Boot.start("catalogues", (client, el) => {
